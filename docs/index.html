<!DOCTYPE html>
<!--
  火力战车 · FIREPOWER RIG
  第一人称转管机枪战车 × 方块僵尸（僵尸模型与数值来自 Blockade）
  手机：陀螺仪转动视角 / 左下摇杆移动 / 右下按钮开火（可在屏幕空白处滑动微调视角）
  电脑：鼠标转动视角 / WASD 移动 / 左键开火 / Esc 暂停
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>火力战车 · Firepower Rig</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#14110f;color:#fff;touch-action:none;
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#touch{position:fixed;inset:0;z-index:1;touch-action:none;display:none}
body.playing.touch #touch{display:block}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none;display:none}
body.playing #hud{display:block}
body:not(.touch) .tOnly{display:none!important}
body.touch .pOnly{display:none!important}
.sa-l{left:calc(16px + env(safe-area-inset-left))}
.sa-r{right:calc(16px + env(safe-area-inset-right))}

/* 左上：心形 + 血条（按草图） */
#hpBox{position:absolute;top:14px;display:flex;align-items:center;gap:10px}
#heart{width:34px;height:31px;fill:#ff3d4d;stroke:#fff;stroke-width:2.2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
#heart.low{animation:beat .6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}40%{transform:scale(1.22)}}
.bar{width:min(32vw,300px);height:16px;border:2px solid rgba(255,255,255,.9);background:rgba(0,0,0,.45);position:relative;overflow:hidden}
#hpFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#7dff6a,#2fbf3a);transition:width .12s}
#hpGhost{position:absolute;left:0;top:0;bottom:0;width:100%;background:rgba(255,255,255,.55)}
#hpTxt{font-weight:900;font-size:15px;text-shadow:0 1px 3px #000;min-width:58px}

#waveBox{position:absolute;left:50%;top:10px;transform:translateX(-50%);text-align:center;text-shadow:0 2px 4px rgba(0,0,0,.7)}
#waveTxt{font-size:20px;font-weight:900;letter-spacing:2px}
#subTxt{font-size:13px;opacity:.85;margin-top:2px}
#scoreTxt{font-size:13px;color:#ffd25a;font-weight:800;margin-top:2px}
#bossBox{position:absolute;left:50%;top:72px;transform:translateX(-50%);width:min(46vw,420px);display:none;text-align:center}
#bossName{font-size:13px;font-weight:900;color:#ff6a5a;text-shadow:0 1px 3px #000;margin-bottom:3px;letter-spacing:1px}
.bbar{height:10px;border:2px solid #fff;background:rgba(0,0,0,.5);position:relative}
#bossFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#ff5a3a,#b0101a)}

#radar{position:absolute;top:12px;width:120px;height:120px;border-radius:50%}
.hbtn{position:absolute;pointer-events:auto;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.75);color:#fff;
  border-radius:10px;font-weight:800;font-size:14px;font-family:inherit;padding:7px 11px;touch-action:manipulation}
.hbtn:active{background:rgba(255,255,255,.25)}
#pauseBtn{top:14px}
#calBtn{top:60px}

/* 准星：[ · ]（按草图） */
#cross{position:absolute;left:50%;top:50%;width:0;height:0;--g:14px}
#cross .br{position:absolute;top:-15px;width:9px;height:30px;border:3px solid rgba(255,255,255,.92);filter:drop-shadow(0 0 2px rgba(0,0,0,.8))}
#cross .l{left:calc(-1*var(--g) - 9px);border-right:none}
#cross .r{left:var(--g);border-left:none}
#cross .dot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;border:2px solid #fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.8))}
#cross.hot .br{border-color:#ff8a3a}
#hitm{position:absolute;left:0;top:0;opacity:0}
#hitm i{position:absolute;width:3px;height:11px;background:#fff;left:-1.5px;top:-5.5px}
#hitm i:nth-child(1){transform:rotate(45deg) translateY(-17px)}
#hitm i:nth-child(2){transform:rotate(135deg) translateY(-17px)}
#hitm i:nth-child(3){transform:rotate(225deg) translateY(-17px)}
#hitm i:nth-child(4){transform:rotate(315deg) translateY(-17px)}
#hitm.kill i{background:#ff3a3a;height:14px}
#hitm.head i{background:#ffd23a}
#heatBox{position:absolute;left:50%;top:calc(50% + 34px);transform:translateX(-50%);width:90px;text-align:center}
.hb{height:5px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.5);position:relative}
#heatFill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffb23a}
#heatTxt{font-size:12px;font-weight:900;color:#ff5a2a;opacity:0;text-shadow:0 1px 2px #000;letter-spacing:2px}

#dmgDirs{position:absolute;left:50%;top:50%;width:0;height:0}
.dd{position:absolute;left:0;top:0;width:0;height:0}
.dd i{position:absolute;left:-34px;top:-150px;width:68px;height:16px;border-radius:50% 50% 0 0/100% 100% 0 0;background:rgba(255,40,30,.85);filter:blur(1px)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(200,0,0,.75) 100%);opacity:0}
#ann{position:absolute;left:0;right:0;top:24%;text-align:center;opacity:0;text-shadow:0 3px 8px rgba(0,0,0,.8)}
#annT{font-size:clamp(28px,6vw,54px);font-weight:900;letter-spacing:4px}
#annS{font-size:clamp(13px,2.4vw,18px);margin-top:6px;opacity:.9}
#toast{position:absolute;left:50%;top:calc(50% + 70px);transform:translateX(-50%);background:rgba(0,0,0,.6);border-left:4px solid #ffb23a;
  padding:8px 14px;font-size:14px;max-width:80vw;opacity:0;transition:opacity .3s;white-space:nowrap}
#clickHint{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:10px 18px;border-radius:8px;font-weight:800;display:none}

/* 左下摇杆 / 右下开火（按草图） */
#stick{position:absolute;left:calc(40px + env(safe-area-inset-left));bottom:34px;width:150px;height:150px;border-radius:50%;
  border:3px solid rgba(255,255,255,.75);background:rgba(0,0,0,.18)}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.25)}
#fireBtn{position:absolute;right:calc(44px + env(safe-area-inset-right));bottom:44px;width:128px;height:128px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);background:rgba(255,80,30,.22)}
#fireBtn svg{position:absolute;inset:0;width:100%;height:100%}
#fireBtn.on{background:rgba(255,120,40,.5);transform:scale(.94)}
#fireBtn.hot{border-color:#ff5a2a}

/* 覆盖层 */
.ov{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(10,8,6,.55);backdrop-filter:blur(3px)}
.ov.show{display:flex}
.panel{background:linear-gradient(160deg,rgba(40,34,28,.96),rgba(20,17,14,.96));border:2px solid #6b5a44;box-shadow:0 0 0 4px rgba(0,0,0,.35),0 20px 60px rgba(0,0,0,.6);
  padding:22px 28px;max-width:min(92vw,560px);max-height:92vh;overflow:auto;text-align:center}
.logo .l1{display:block;font-size:clamp(38px,8vw,66px);font-weight:900;letter-spacing:6px;color:#ffb23a;
  text-shadow:4px 4px 0 #6a2a0a,0 0 30px rgba(255,140,40,.35)}
.logo .l2{display:block;font-size:13px;letter-spacing:9px;color:#d8c8a8;margin-top:2px}
.tag{margin:12px 0 16px;color:#e8dcc8;font-size:14px;line-height:1.6}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{font-family:inherit;font-weight:900;font-size:17px;padding:11px 26px;border:2px solid #b8a07a;background:#3a3026;color:#fff;cursor:pointer;letter-spacing:2px;
  box-shadow:0 4px 0 #120e0a;touch-action:manipulation}
.btn:hover{background:#4a3e30}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #120e0a}
.btn.primary{background:#d9661c;border-color:#ffcf8a}
.btn.primary:hover{background:#ec7424}
.ctrl{margin-top:16px;font-size:13px;color:#cdbfa6;line-height:1.8;text-align:left;display:inline-block}
.ctrl b{color:#ffd28a}
.best{margin-top:10px;font-size:13px;color:#ffd25a}
h2{font-size:24px;letter-spacing:4px;margin-bottom:12px;color:#ffb23a}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:10px 0;font-size:15px;text-align:left}
.row input[type=range]{width:180px;accent-color:#ff8a2a}
.row input[type=checkbox]{width:22px;height:22px;accent-color:#ff8a2a}
.row output{width:34px;text-align:right;color:#ffd28a;font-weight:800}
.cards{display:flex;gap:14px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.card{width:min(28vw,170px);min-height:170px;background:#2a231c;border:2px solid #7a6548;padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;
  box-shadow:0 5px 0 #0e0b08;transition:transform .1s;touch-action:manipulation}
.card:hover{transform:translateY(-4px);border-color:#ffb23a}
.card .ic{font-size:36px;line-height:1}
.card .nm{font-weight:900;font-size:16px;color:#ffd28a}
.card .ds{font-size:13px;color:#d8cbb4;line-height:1.45}
.card .lv{font-size:11px;color:#9a8a70;margin-top:auto}
.card .k{font-size:11px;color:#9a8a70}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 26px;margin:10px auto 18px;font-size:16px;text-align:left;width:max-content}
.stats b{color:#ffd28a;text-align:right}
@media (max-height:430px){
  .panel{padding:12px 20px}
  .logo .l1{font-size:40px}
  .tag{margin:6px 0 10px}
  .ctrl{margin-top:8px;line-height:1.6}
  h2{margin-bottom:6px;font-size:20px}
  .row{margin:5px 0}
  .card{min-height:140px;padding:10px 8px}
  #stick{width:130px;height:130px;bottom:22px}
  #fireBtn{width:112px;height:112px;bottom:28px}
  #radar{width:100px;height:100px}
  #pauseBtn,#calBtn{right:calc(126px + env(safe-area-inset-right))!important}
  #calBtn{top:56px}
}
#rotate{position:fixed;inset:0;z-index:9;background:#14110f;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-size:18px;text-align:center}
@media (orientation:portrait){ body.touch #rotate{display:flex} }
#rotate .ph{width:60px;height:100px;border:4px solid #ffb23a;border-radius:10px;animation:rot 2s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#loading{position:fixed;inset:0;z-index:10;background:#14110f;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ffb23a;letter-spacing:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch"></div>

<div id="hud">
  <div id="hpBox" class="sa-l">
    <svg id="heart" viewBox="-2 -2 36 33"><path d="M16 29C6 21 0 15 0 8.5A8 8 0 0 1 16 5A8 8 0 0 1 32 8.5C32 15 26 21 16 29Z"/></svg>
    <div class="bar"><i id="hpGhost"></i><i id="hpFill"></i></div><b id="hpTxt">100</b>
  </div>
  <div id="waveBox"><div id="waveTxt">准备</div><div id="subTxt"></div><div id="scoreTxt">0</div></div>
  <div id="bossBox"><div id="bossName">BOSS · 屠夫</div><div class="bbar"><i id="bossFill"></i></div></div>
  <canvas id="radar" class="sa-r" width="240" height="240"></canvas>
  <button id="pauseBtn" class="hbtn" style="right:calc(150px + env(safe-area-inset-right))">❚❚</button>
  <button id="calBtn" class="hbtn tOnly" style="right:calc(150px + env(safe-area-inset-right))">⊙ 校准</button>
  <div id="cross"><i class="br l"></i><i class="dot"></i><i class="br r"></i><div id="hitm"><i></i><i></i><i></i><i></i></div></div>
  <div id="heatBox"><div class="hb"><i id="heatFill"></i></div><div id="heatTxt">过热</div></div>
  <div id="dmgDirs"></div>
  <div id="vig"></div>
  <div id="ann"><div id="annT"></div><div id="annS"></div></div>
  <div id="toast"></div>
  <div id="clickHint" class="pOnly">点击画面继续操控</div>
  <div id="stick" class="tOnly"><div id="knob"></div></div>
  <div id="fireBtn" class="tOnly">
    <svg viewBox="0 0 128 128">
      <circle cx="64" cy="64" r="58" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="7"/>
      <circle id="heatRing" cx="64" cy="64" r="58" fill="none" stroke="#ffb23a" stroke-width="7" stroke-dasharray="364.4" stroke-dashoffset="364.4" transform="rotate(-90 64 64)"/>
      <path d="M38 70 L74 38 L66 62 L92 60 L72 92 L74 72 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

<div id="menu" class="ov show">
  <div class="panel">
    <div class="logo"><span class="l1">火力战车</span><span class="l2">FIREPOWER RIG</span></div>
    <p class="tag">驾驶转管机枪战车，在废墟小镇里撑过一波又一波方块僵尸。</p>
    <div class="btns"><button id="bStart" class="btn primary">开始游戏</button><button id="bSet" class="btn">设置</button></div>
    <div class="ctrl" id="ctrlHint"></div>
    <div class="best" id="bestTxt"></div>
  </div>
</div>

<div id="settings" class="ov">
  <div class="panel" style="min-width:min(92vw,400px)">
    <h2>设置</h2>
    <label class="row tOnly">陀螺仪瞄准<input type="checkbox" id="sGyro"></label>
    <label class="row tOnly">陀螺仪灵敏度<input type="range" id="sGyroSens" min="0.5" max="3" step="0.1"><output></output></label>
    <label class="row tOnly">滑屏灵敏度<input type="range" id="sDragSens" min="0.3" max="3" step="0.1"><output></output></label>
    <label class="row pOnly">鼠标灵敏度<input type="range" id="sMouseSens" min="0.2" max="3" step="0.1"><output></output></label>
    <label class="row">音量<input type="range" id="sVol" min="0" max="1" step="0.05"><output></output></label>
    <label class="row">高画质（阴影）<input type="checkbox" id="sHq"></label>
    <div class="btns" style="margin-top:14px"><button id="sBack" class="btn primary">返回</button></div>
  </div>
</div>

<div id="pause" class="ov">
  <div class="panel">
    <h2>暂停</h2>
    <div class="btns" style="flex-direction:column;align-items:stretch">
      <button id="pResume" class="btn primary">继续</button>
      <button id="pSet" class="btn">设置</button>
      <button id="pRestart" class="btn">重新开始</button>
      <button id="pQuit" class="btn">返回主菜单</button>
    </div>
  </div>
</div>

<div id="upgrade" class="ov">
  <div class="panel" style="max-width:min(96vw,640px)">
    <h2 id="upTitle">第 1 波完成</h2>
    <div style="font-size:14px;color:#d8cbb4">选择一项战车强化</div>
    <div class="cards" id="cards"></div>
  </div>
</div>

<div id="over" class="ov">
  <div class="panel">
    <h2 style="color:#ff5a4a">战车被摧毁</h2>
    <div class="stats" id="stats"></div>
    <div class="btns"><button id="oAgain" class="btn primary">再来一局</button><button id="oMenu" class="btn">主菜单</button></div>
  </div>
</div>

<div id="rotate"><div class="ph"></div><div>请把手机横过来</div></div>
<div id="loading">LOADING…</div>

<script src="three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   0. 工具
   ===================================================================== */
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a ? a : (v>b ? b : v);
const lerp = (a,b,t) => a + (b-a)*t;
const damp = (a,b,k,dt) => a + (b-a)*(1-Math.exp(-k*dt));
const wrapA = a => { while(a > Math.PI) a -= Math.PI*2; while(a < -Math.PI) a += Math.PI*2; return a; };
const angleDamp = (a,b,k,dt) => a + wrapA(b-a)*(1-Math.exp(-k*dt));
function seeded(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let _rmin = 0, _rmax = 0;
function _slab(o, d, a, b){
  if(Math.abs(d) < 1e-9) return o >= a && o <= b;
  let t1 = (a - o)/d, t2 = (b - o)/d; if(t1 > t2){ const t = t1; t1 = t2; t2 = t; }
  if(t1 > _rmin) _rmin = t1; if(t2 < _rmax) _rmax = t2; return _rmin <= _rmax;
}
function rayAABB(o, d, x0,y0,z0, x1,y1,z1){
  _rmin = -Infinity; _rmax = Infinity;
  if(!_slab(o.x, d.x, x0, x1) || !_slab(o.y, d.y, y0, y1) || !_slab(o.z, d.z, z0, z1) || _rmax < 0) return -1;
  return _rmin > 0 ? _rmin : 0;
}

const IS_TOUCH = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && matchMedia('(pointer: coarse)').matches;
const IS_APP = !!window.Capacitor;
if(IS_TOUCH) document.body.classList.add('touch');

/* =====================================================================
   1. 设置（localStorage）
   ===================================================================== */
const S = { gyro:true, gyroSens:1.5, dragSens:1.0, mouseSens:1.0, vol:0.8, hq:!IS_TOUCH };
try { Object.assign(S, JSON.parse(localStorage.getItem('fp_settings') || '{}')); } catch(e){}
const saveS = () => { try { localStorage.setItem('fp_settings', JSON.stringify(S)); } catch(e){} };
const getBest = () => { try { return +localStorage.getItem('fp_best') || 0; } catch(e){ return 0; } };
const setBest = v => { try { localStorage.setItem('fp_best', v); } catch(e){} };

/* =====================================================================
   2. 音效（WebAudio 合成，无外部文件）
   ===================================================================== */
const Sfx = {
  ctx:null, out:null, nb:null, eng:null,
  init(){
    if(this.ctx){ if(this.ctx.state !== 'running') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const c = this.ctx = new AC();
    this.out = c.createGain(); this.out.gain.value = S.vol;
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    this.out.connect(comp); comp.connect(c.destination);
    const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    this.nb = b;
    const eo = c.createOscillator(), eo2 = c.createOscillator(), ef = c.createBiquadFilter(), eg = c.createGain();
    eo.type = 'sawtooth'; eo.frequency.value = 40; eo2.type = 'square'; eo2.frequency.value = 20;
    ef.type = 'lowpass'; ef.frequency.value = 240; eg.gain.value = 0;
    eo.connect(ef); eo2.connect(ef); ef.connect(eg); eg.connect(this.out); eo.start(); eo2.start();
    this.eng = { eo, eo2, ef, eg };
  },
  setVol(v){ if(this.out) this.out.gain.value = v; },
  dest(pan){
    if(!pan || !this.ctx.createStereoPanner) return this.out;
    const p = this.ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); p.connect(this.out); return p;
  },
  noise(dur, vol, type, freq, q, pan, attack=0.002){
    if(!this.ctx || vol < 0.003) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nb; s.loop = true; f.type = type; f.frequency.value = freq; if(q) f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.dest(pan)); s.start(t, Math.random()*0.6); s.stop(t + dur + 0.05);
  },
  tone(type, f0, f1, dur, vol, pan, attack=0.003, delay=0){
    if(!this.ctx || vol < 0.003) return;

class Parts {
  constructor(max, mat){
    this.max = max; this.mesh = new THREE.InstancedMesh(boxGeo, mat, max);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); this.mesh.frustumCulled = false;
    this.items = []; this.free = []; this.c = new THREE.Color(1, 1, 1);
    for(let i=0;i<max;i++){ this.mesh.setMatrixAt(i, ZERO_M); this.mesh.setColorAt(i, this.c); this.free.push(max - 1 - i); }
    this.m = new THREE.Matrix4(); this.q = new THREE.Quaternion(); this.e = new THREE.Euler(); this.s = new V3();
    scene.add(this.mesh);
  }
  spawn(x, y, z, vx, vy, vz, size, color, life, grav=22, bounce=0.35, drag=0){
    if(!this.free.length) return;
    const i = this.free.pop();
    this.items.push({ i, p:new V3(x, y, z), v:new V3(vx, vy, vz), size, life, max:life, grav, bounce, drag, rx:rand(-8, 8), rz:rand(-8, 8), a:Math.random()*6 });
    this.c.setHex(color); if(typeof color === 'object') this.c.copy(color);
    this.mesh.setColorAt(i, this.c); this.mesh.instanceColor.needsUpdate = true;
  }
  spawnC(x, y, z, vx, vy, vz, size, c3, life, grav, bounce, drag){
    if(!this.free.length) return;
    const i = this.free[this.free.length - 1];
    this.spawn(x, y, z, vx, vy, vz, size, 0xffffff, life, grav, bounce, drag);
    this.mesh.setColorAt(i, c3);
  }
  update(dt){
    const L = this.items;
    for(let k=L.length-1;k>=0;k--){
      const it = L[k]; it.life -= dt;
      if(it.life <= 0){ this.mesh.setMatrixAt(it.i, ZERO_M); this.free.push(it.i); L[k] = L[L.length - 1]; L.pop(); continue; }
      it.v.y -= it.grav*dt; if(it.drag){ const f = Math.exp(-it.drag*dt); it.v.multiplyScalar(f); }
      it.p.addScaledVector(it.v, dt);
      const hs = it.size*0.5;
      if(it.p.y < hs && it.grav > 0){ it.p.y = hs; it.v.y *= -it.bounce; it.v.x *= 0.6; it.v.z *= 0.6; it.rx *= 0.5; it.rz *= 0.5; }
      it.a += dt;
      const k2 = Math.min(1, it.life/(it.max*0.35));
      this.e.set(it.a*it.rx, 0, it.a*it.rz); this.q.setFromEuler(this.e); this.s.setScalar(it.size*k2);
      this.m.compose(it.p, this.q, this.s); this.mesh.setMatrixAt(it.i, this.m);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
  clear(){ for(const it of this.items){ this.mesh.setMatrixAt(it.i, ZERO_M); this.free.push(it.i); } this.items.length = 0; this.mesh.instanceMatrix.needsUpdate = true; }
}

const Car = {
  pos:new V3(), vel:new V3(), yaw:0, pitch:0, body:0, hp:100, maxHp:100, dead:false, deadT:0, hurtT:0, ghost:100,
  reset(){ this.pos.set(0, 0, 8); this.vel.set(0, 0, 0); this.yaw = 0; this.pitch = 0; this.body = 0; this.maxHp = 100; this.hp = 100; this.ghost = 100; this.dead = false; this.deadT = 0; carG.visible = true; },
  heal(n){ this.hp = Math.min(this.maxHp, this.hp + n); },
  damage(n, from, acid){
    if(this.dead || Game.state !== 'play') return;
    this.hp -= n; this.hurtT = 1;
    HUD.dmgFrom(from); Cam.trauma(0.25 + n/80); Sfx.hurt(); vibrate(acid ? 30 : 45);
    if(this.hp <= 0){ this.hp = 0; this.die(); }
  },
  die(){
    this.dead = true; this.deadT = 0; Input.firing = false;
    explode(this.pos.clone().setY(1.2), { radius:6, zDmg:300, pDmg:0 });
    FX.fire(this.pos.clone().setY(1.5), 6); Game.timeScale = 0.35; vibrate([80, 40, 160]);
  },
  // 撞击僵尸（nx,nz：从车指向僵尸的法线）
  ram(z, nx, nz){
    const rel = this.vel.x*nx + this.vel.z*nz;
    if(rel > 3.2 && z.ramCd <= 0){
      z.ramCd = 0.45;
      const heavy = z.cfg.heavy, dmg = (rel - 2.2)*13*Up.ramMul*(z.type === 'boss' ? 0.4 : 1);
      const killed = Zombies.damage(z, dmg, new V3(nx, 0, nz), heavy ? 4 : rel*1.6, false, z.pos, false);
      if(killed || !heavy){ this.vel.x -= nx*rel*0.3; this.vel.z -= nz*rel*0.3; Sfx.thud(0.6); Cam.trauma(0.12); }
      else { this.vel.x -= nx*rel*1.4; this.vel.z -= nz*rel*1.4; Sfx.thud(1); Cam.trauma(0.35); if(!Up.ramArmor) this.damage(Math.round(rel*0.8), z.pos); }
      if(z.cfg.blast && !z.dead) z.fuseT = Math.max(z.fuseT, z.cfg.blast.fuse - 0.05);   // 撞自爆僵尸 → 当场爆
      vibrate(25);
    } else if(rel > 0){ this.vel.x -= nx*rel*0.5; this.vel.z -= nz*rel*0.5; }
  },
  update(dt){
    if(this.dead){ this.vel.multiplyScalar(Math.exp(-2*dt)); this.pos.addScaledVector(this.vel, dt); return; }
    const mv = Input.moveVec(), maxS = 11*Up.speedMul;
    const fx = -Math.sin(this.yaw), fz = -Math.cos(this.yaw), rx = Math.cos(this.yaw), rz = -Math.sin(this.yaw);
    const tx = (fx*mv.y + rx*mv.x)*maxS, tz = (fz*mv.y + rz*mv.x)*maxS, k = (mv.x || mv.y) ? 2.4 : 1.6;
    this.vel.x = damp(this.vel.x, tx, k, dt); this.vel.z = damp(this.vel.z, tz, k, dt);
    this.pos.addScaledVector(this.vel, dt);
    // 与障碍碰撞（车身前后两个圆）
    const bf = -Math.sin(this.body), bz = -Math.cos(this.body);
    for(const s of [CAR_HALF, -CAR_HALF]){
      const p = { x:this.pos.x + bf*s, z:this.pos.z + bz*s }, ox = p.x, oz = p.z;
      const n = World.pushOut(p, CAR_R);
      if(n){
        this.pos.x += p.x - ox; this.pos.z += p.z - oz;
        const vn = this.vel.x*n.x + this.vel.z*n.z;
        if(vn < 0){ this.vel.x -= n.x*vn*1.2; this.vel.z -= n.z*vn*1.2; if(vn < -5){ Sfx.clank(clamp(-vn/10, 0.3, 1)); Cam.trauma(clamp(-vn/30, 0.1, 0.4)); FX.debris(new V3(p.x - n.x*CAR_R, 1, p.z - n.z*CAR_R), 0x8a8070, 5); } }
      }
    }
    const lim = ARENA - 2.6; this.pos.x = clamp(this.pos.x, -lim, lim); this.pos.z = clamp(this.pos.z, -lim, lim);
    // 车身朝向：朝移动方向；反向时倒车
    const sp = Math.hypot(this.vel.x, this.vel.z);
    if(sp > 0.6){
      const vy = Math.atan2(-this.vel.x, -this.vel.z), diff = Math.abs(wrapA(vy - this.body));
      this.body = angleDamp(this.body, diff > 1.9 ? vy + Math.PI : vy, 3.2*Math.min(1, sp/4), dt);
    }
    const fwd = this.vel.x*bf + this.vel.z*bz;
    for(const w of carWheels) w.rotation.x -= fwd*dt/0.5;
    if(sp > 4 && Math.random() < dt*sp*1.6) FX.dust(new V3(this.pos.x - bf*1.6 + rand(-1, 1), 0.2, this.pos.z - bz*1.6 + rand(-1, 1)), 1, 0x9a8a68, 0.45);
    this.hurtT = Math.max(0, this.hurtT - dt*1.8);
    this.ghost = this.ghost > this.hp ? Math.max(this.hp, this.ghost - dt*40) : this.hp;
  },
  sync(){ carG.position.copy(this.pos); carG.rotation.y = this.body; },
};

const Gun = {
  heat:0, over:false, fireT:0, spin:0, flashT:0, kick:0, shots:0, swayX:0, swayY:0, idleT:0,
  reset(){ this.heat = 0; this.idleT = 0; this.over = false; this.fireT = 0; this.spin = 0; this.flashT = 0; this.kick = 0; this.shots = 0; layoutBarrels(Up.barrels); },
  update(dt){
    this.fireT -= dt; this.idleT += dt;
    // 停火 0.2 秒后才开始散热；连续开火约 4 秒过热
    if(this.over || this.idleT > 0.2) this.heat = Math.max(0, this.heat - (this.over ? 0.45 : 0.55)*dt);
    if(this.over && this.heat <= 0.25){ this.over = false; }

    if(want && this.fireT <= 0){

    gunFlashLight.intensity = show ? 2.2 : 0; muzzleLight.intensity = show ? 2.5 : 0;
    this.kick = damp(this.kick, 0, 18, dt);
    // 枪械晃动（转视角时滞后、移动时摆动）
    const sp = Math.hypot(Car.vel.x, Car.vel.z), t = Game.t;
    this.swayX = damp(this.swayX, clamp(-Input.lastLookDX*3, -0.08, 0.08), 8, dt);
    this.swayY = damp(this.swayY, clamp(Input.lastLookDY*3, -0.06, 0.06), 8, dt);
    gun.position.set(this.swayX + Math.sin(t*7)*0.012*sp/11, this.swayY + Math.abs(Math.cos(t*7))*0.014*sp/11 - this.kick*0.02, this.kick*0.09);
    gun.rotation.set(this.kick*0.03, this.swayX*0.5, 0);
  },
  _o:new V3(), _d:new V3(), _f:new V3(), _ndc:new V3(),
  fire(){
    this.shots++; this.flashT = 0.04; this.kick = 1;
    Cam.recoil += 0.006; Cam.trauma(0.035);
    Sfx.shot();
    const boom = Up.boomEvery && this.shots % Up.boomEvery === 0;
    const spread = 0.008 + this.heat*0.012 + (Up.barrels - 1)*0.006;
    camera.getWorldDirection(this._f);
    for(let i=0;i<Up.barrels;i++){
      const b = barrelSets[i];
      b.fl.scale.setScalar(rand(0.55, 0.9)); b.fl.rotation.z = Math.random()*6; b.fl2.scale.set(rand(0.4, 0.6), rand(0.25, 0.4), 1);
      const o = this._o.copy(camera.position), d = this._d.copy(this._f);
      d.x += rand(-spread, spread); d.y += rand(-spread, spread); d.z += rand(-spread, spread); d.normalize();
      this.hitscan(o, d, boom && i === 0, b);
    }
    muzzleLight.position.copy(camera.position).addScaledVector(this._f, 2);
  },
  hitscan(o, d, boom, barrel){
    const wh = World.ray(o, d, 160);
    const zs = Zombies.hits(o, d, wh.t);
    let n = 1 + Up.pierce, end = wh.t, anyKill = false, anyHead = false, any = false;
    for(const h of zs){
      if(n <= 0) break;
      const dmg = 20*Up.dmgMul*(h.head ? Up.headMul : 1), pt = o.clone().addScaledVector(d, h.t);
      const killed = Zombies.damage(h.z, dmg, d, 1.2, h.head, pt, false);
      FX.blood(pt, d, h.head ? 7 : 4);
      any = true; anyKill = anyKill || killed; anyHead = anyHead || h.head;
      n--; if(n === 0) end = h.t;
    }
    if(any){ HUD.hitmark(anyHead, anyKill); Sfx.hit(anyHead); }
    const hitP = o.clone().addScaledVector(d, end);
    if(end === wh.t && wh.hit){
      if(wh.kind === 'ground') FX.dust(hitP, 2, 0x7a6a4a, 0.18); else { FX.sparks(hitP, 3); FX.debris(hitP, wh.c, 2); }
    }
    if(boom) explode(hitP, { radius:3.2, zDmg:55, pDmg:0 });
    // 弹道起点：把枪口在枪械摄像机中的屏幕位置投回主摄像机

    Tracers.add(camera.position.clone().addScaledVector(sd, 2.6), hitP);

};

const Cam = {
  tr:0, recoil:0, t:0,
  trauma(v){ this.tr = Math.min(1, this.tr + v); },
  update(dt){
    this.t += dt; this.tr = Math.max(0, this.tr - dt*1.6); this.recoil = damp(this.recoil, 0, 10, dt);
    const s = this.tr*this.tr, t = this.t*40;

    camera.position.set(Car.pos.x + ox, 2.75 + Math.sin(Game.t*11)*0.025*Math.min(1, sp/6), Car.pos.z + oz);
    if(Car.dead) camera.position.y = 2.75 + Math.min(Car.deadT, 1.5)*1.6;
    camera.rotation.set(Car.pitch + this.recoil + s*0.05*Math.sin(t*1.3), Car.yaw + s*0.05*Math.sin(t*1.1 + 2), s*0.04*Math.sin(t*0.9 + 4));
  },
};

// 触屏
const Touch = { stick:null, fire:null, look:new Map(), base:{ x:0, y:0 } };
const touchEl = $('touch'), stickEl = $('stick'), knobEl = $('knob'), fireEl = $('fireBtn');
const STICK_R = 58;
function stickCenter(){ const r = stickEl.getBoundingClientRect(); return { x:r.left + r.width/2, y:r.top + r.height/2 }; }
function setKnob(dx, dy){ knobEl.style.transform = `translate(${dx}px,${dy}px)`; }
touchEl.addEventListener('pointerdown', e => {
  e.preventDefault(); Sfx.init();
  const x = e.clientX, y = e.clientY, W = innerWidth, H = innerHeight;
  const fr = fireEl.getBoundingClientRect(), fx = fr.left + fr.width/2, fy = fr.top + fr.height/2;
  if(!Touch.fire && Math.hypot(x - fx, y - fy) < fr.width*0.7){ Touch.fire = { id:e.pointerId, x, y }; Input.firing = true; fireEl.classList.add('on'); return; }
  if(!Touch.stick && x < W*0.45 && y > H*0.35){
    let c = stickCenter();
    if(Math.hypot(x - c.x, y - c.y) > STICK_R*1.3){ stickEl.style.left = (x - 75) + 'px'; stickEl.style.top = (y - 75) + 'px'; stickEl.style.bottom = 'auto'; c = { x, y }; }
    Touch.stick = { id:e.pointerId, cx:c.x, cy:c.y }; moveStick(x, y); return;
  }
  Touch.look.set(e.pointerId, { x, y });
}, { passive:false });
function moveStick(x, y){
  const s = Touch.stick; let dx = x - s.cx, dy = y - s.cy; const l = Math.hypot(dx, dy);
  if(l > STICK_R){ dx *= STICK_R/l; dy *= STICK_R/l; }
  setKnob(dx, dy);
  const m = Math.min(1, l/STICK_R), dead = 0.12, k = m < dead ? 0 : (m - dead)/(1 - dead);
  Input.stick.x = l > 0 ? dx/Math.min(l, STICK_R)*k : 0; Input.stick.y = l > 0 ? -dy/Math.min(l, STICK_R)*k : 0;
}
touchEl.addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY, k = 0.005*S.dragSens;
  if(Touch.stick && Touch.stick.id === e.pointerId){ moveStick(x, y); return; }
  if(Touch.fire && Touch.fire.id === e.pointerId){ Input.lookDX += (x - Touch.fire.x)*k*0.8; Input.lookDY += (y - Touch.fire.y)*k*0.8; Touch.fire.x = x; Touch.fire.y = y; return; }
  const L = Touch.look.get(e.pointerId);
  if(L){ Input.lookDX += (x - L.x)*k; Input.lookDY += (y - L.y)*k; L.x = x; L.y = y; }
}, { passive:false });
function touchEnd(e){
  if(Touch.stick && Touch.stick.id === e.pointerId){ Touch.stick = null; Input.stick.x = Input.stick.y = 0; setKnob(0, 0); stickEl.style.left = ''; stickEl.style.top = ''; stickEl.style.bottom = ''; }
  if(Touch.fire && Touch.fire.id === e.pointerId){ Touch.fire = null; Input.firing = false; fireEl.classList.remove('on'); }
  Touch.look.delete(e.pointerId);
}
touchEl.addEventListener('pointerup', touchEnd); touchEl.addEventListener('pointercancel', touchEnd);
function releaseTouches(){ Touch.stick = null; Touch.fire = null; Touch.look.clear(); Input.stick.x = Input.stick.y = 0; Input.firing = false; setKnob(0, 0); fireEl.classList.remove('on'); stickEl.style.left = stickEl.style.top = stickEl.style.bottom = ''; }

// 陀螺仪：设备姿态 → 摄像机朝向（与 three.js DeviceOrientationControls 相同的换算），每帧取增量加到视角上
const Gyro = {
  has:false, a:0, b:0, g:0, lastYaw:null, lastPitch:null, pendY:0, pendP:0, seenT:0,
  q:new THREE.Quaternion(), e:new THREE.Euler(), q0:new THREE.Quaternion(), q1:new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)), z:new V3(0, 0, 1), f:new V3(),
  onEvent(ev){ if(ev.alpha == null && ev.beta == null) return; Gyro.has = true; Gyro.a = ev.alpha || 0; Gyro.b = ev.beta || 0; Gyro.g = ev.gamma || 0; },
  async request(){
    try { if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') await DeviceOrientationEvent.requestPermission(); } catch(e){}
  },
  reset(){ this.lastYaw = null; this.lastPitch = null; this.pendY = this.pendP = 0; },
  step(dt){
    if(!IS_TOUCH || !S.gyro || !this.has) return;
    const D = THREE.MathUtils.DEG2RAD, orient = ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0)*D;
    this.e.set(this.b*D, this.a*D, -this.g*D, 'YXZ');
    this.q.setFromEuler(this.e); this.q.multiply(this.q1); this.q.multiply(this.q0.setFromAxisAngle(this.z, -orient));
    this.f.set(0, 0, -1).applyQuaternion(this.q);
    const yaw = Math.atan2(-this.f.x, -this.f.z), pitch = Math.asin(clamp(this.f.y, -1, 1));
    if(this.lastYaw !== null){
      const dy = wrapA(yaw - this.lastYaw), dp = pitch - this.lastPitch;
      if(Math.abs(pitch) < 1.3) this.pendY += dy*S.gyroSens;
      this.pendP += dp*S.gyroSens;
    }
    this.lastYaw = yaw; this.lastPitch = pitch;
    // 轻微平滑，去掉传感器抖动
    const k = 1 - Math.exp(-28*dt), ty = this.pendY*k, tp = this.pendP*k;
    this.pendY -= ty; this.pendP -= tp;
    Car.yaw += ty; Car.pitch = clamp(Car.pitch + tp, -1.0, 0.95);
  },
};
addEventListener('deviceorientation', Gyro.onEvent);

/* =====================================================================
   13. 波次
   ===================================================================== */
const Waves = {
  n:0, q:[], spawnT:0, phase:'wait', t:0, hpMul:1, seen:{},
  reset(){ this.n = 0; this.q = []; this.phase = 'wait'; this.t = 2.5; this.seen = {}; },
  build(n){
    const total = Math.round(6 + n*3 + n*n*0.12);
    const w = { normal:1, runner:n >= 2 ? 0.2 + 0.035*n : 0, exploder:n >= 3 ? 0.1 + 0.012*n : 0, brute:n >= 4 ? 0.06 + 0.012*n : 0, spitter:n >= 5 ? 0.08 + 0.01*n : 0 };
    const sum = Object.values(w).reduce((a, b) => a + b, 0), q = [];
    for(let i=0;i<total;i++){ let r = Math.random()*sum; for(const k in w){ r -= w[k]; if(r <= 0){ q.push(k); break; } } }
    // 新敌人首次登场的那一波，保证前面就出现一只
    const intro = { 2:'runner', 3:'exploder', 4:'brute', 5:'spitter' }[n]; if(intro) q.splice(2, 0, intro);
    if(n % 5 === 0) q.splice(Math.floor(q.length*0.25), 0, 'boss');
    return q;
  },
  start(n){
    this.n = n; this.q = this.build(n); this.phase = 'combat'; this.spawnT = 0.5; this.hpMul = 1 + 0.11*(n - 1);
    HUD.announce('第 ' + n + ' 波', n % 5 === 0 ? 'BOSS 来袭！' : '消灭所有僵尸', n % 5 === 0 ? '#ff5a3a' : '#ffd28a');
    Sfx.horn();
    if(n > 1) Pickups.randomSpawn();
  },
  remaining(){ return this.q.length + Zombies.list.filter(z => !z.idle).length; },
  spawnOne(type){
    for(let i=0;i<24;i++){
      const a = Math.random()*Math.PI*2, r = rand(30, 54);
      const x = clamp(Car.pos.x + Math.cos(a)*r, -ARENA + 3, ARENA - 3), z = clamp(Car.pos.z + Math.sin(a)*r, -ARENA + 3, ARENA - 3);
      if(Math.hypot(x - Car.pos.x, z - Car.pos.z) < 24) continue;
      const p = { x, z }; if(World.pushOut(p, 1.2*ZT[type].scale)) continue;
      const hp = type === 'boss' ? 1 + 0.5*(this.n/5 - 1) : this.hpMul;
      const zz = Zombies.spawn(type, x, z, hp);
      if(zz && !this.seen[type]){ this.seen[type] = true; if(ZINFO[type]) HUD.toast('新敌人 · ' + ZNAME[type] + '：' + ZINFO[type], 5); }
      if(zz && type === 'boss'){ Sfx.roar(); Cam.trauma(0.4); }
      return !!zz;
    }
    return false;
  },
  update(dt){
    if(this.phase === 'wait'){ this.t -= dt; if(this.t <= 0) this.start(this.n + 1); return; }
    if(this.phase === 'combat'){
      this.spawnT -= dt;
      const cap = Math.min(MAX_Z - 4, 22 + this.n*2);
      if(this.spawnT <= 0 && this.q.length && Zombies.list.length < cap){
        if(this.spawnOne(this.q[0])) this.q.shift();
        this.spawnT = Math.max(0.3, 1.25 - this.n*0.06)*rand(0.6, 1.4);
      }
      if(!this.q.length && !Zombies.list.length){ this.phase = 'clear'; this.t = 1.8; HUD.announce('第 ' + this.n + ' 波 完成', '+' + (this.n*100) + ' 分', '#7dff6a'); Game.score += this.n*100; Sfx.pickup(); }
      return;
    }
    if(this.phase === 'clear'){ this.t -= dt; if(this.t <= 0 && !Car.dead) Game.showUpgrade(); }
  },
};

  update(dt){

    this.set('hpTxt', Math.ceil(Car.hp) + '/' + Car.maxHp);

    this.set('scoreTxt', Game.score + ' 分 · 击杀 ' + Game.kills);
    const b = Zombies.bossRef;

    $('heatTxt').style.opacity = Gun.over ? (Math.sin(Game.t*14) > 0 ? 1 : 0.3) : 0;
    $('heatRing').setAttribute('stroke-dashoffset', 364.4*(1 - Gun.heat));
    $('heatRing').setAttribute('stroke', Gun.over ? '#ff4a2a' : '#ffb23a');
    fireEl.classList.toggle('hot', Gun.over);
    const cross = $('cross'); cross.style.setProperty('--g', (12 + Gun.heat*10 + Gun.spin*3) + 'px'); cross.classList.toggle('hot', Gun.over);
    // 命中标记 / 公告 / 提示
    this.hitT -= dt; $('hitm').style.opacity = this.hitT > 0 ? 1 : 0;
    this.annT -= dt; $('ann').style.opacity = clamp(this.annT/0.5, 0, 1);
    this.toastT -= dt; if(this.toastT <= 0) $('toast').style.opacity = 0;
    $('vig').style.opacity = Math.max(Car.hurtT*0.8, hp < 0.3 ? 0.35 + Math.sin(Game.t*5)*0.15 : 0);
    for(const d of [...$('dmgDirs').children]){ d._t -= dt; d.style.opacity = d._t; if(d._t <= 0) d.remove(); }
    $('clickHint').style.display = !IS_TOUCH && Game.state === 'play' && !Input.locked && !Car.dead ? 'block' : 'none';
    this.radar();
  },
  radar(){
    const c = $('radar'), g = c.getContext('2d'), W = c.width, R = W/2 - 6, RANGE = 55;
    g.clearRect(0, 0, W, W);
    g.save(); g.translate(W/2, W/2);
    g.fillStyle = 'rgba(12,18,10,.6)'; g.beginPath(); g.arc(0, 0, R + 4, 0, Math.PI*2); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 3; g.stroke();
    g.strokeStyle = 'rgba(140,255,140,.18)'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, R*0.5, 0, Math.PI*2); g.stroke();

    g.fillStyle = 'rgba(255,255,255,.08)'; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R, -Math.PI/2 - 0.75, -Math.PI/2 + 0.75); g.closePath(); g.fill();
    const cy = Math.cos(Car.yaw), sy = Math.sin(Car.yaw);
    const proj = (x, z) => { const dx = x - Car.pos.x, dz = z - Car.pos.z, f = -dx*sy - dz*cy, r = dx*cy - dz*sy; let px = r/RANGE*R, py = -f/RANGE*R; const l = Math.hypot(px, py); if(l > R){ px *= R/l; py *= R/l; } return [px, py, l > R]; };
    for(const p of Pickups.list){ const [x, y] = proj(p.g.position.x, p.g.position.z); g.fillStyle = '#6aff6a'; g.fillRect(x - 5, y - 2, 10, 4); g.fillRect(x - 2, y - 5, 4, 10); }
    for(const z of Zombies.list){
      if(z.idle) continue;
      const [x, y, edge] = proj(z.pos.x, z.pos.z), s = z.type === 'boss' ? 9 : z.cfg.heavy ? 6 : 4.5;
      g.globalAlpha = edge ? 0.55 : 1; g.fillStyle = z.cfg.map; g.beginPath(); g.arc(x, y, s, 0, Math.PI*2); g.fill();
    }
    g.globalAlpha = 1;
    // 战车（车身方向）
    g.rotate(-(Car.body - Car.yaw)); g.fillStyle = '#fff'; g.fillRect(-5, -8, 10, 16); g.fillStyle = '#ffb23a'; g.fillRect(-5, -8, 10, 4);
    g.restore();
  },
};

/* =====================================================================

const Game = {
  state:'menu', t:0, timeScale:1, score:0, kills:0, unlockOk:false, menuT:0,
  setState(s){
    this.state = s;
    document.body.classList.toggle('playing', s === 'play' || s === 'pause' || s === 'upgrade' || s === 'over');
  },
  showOv(id){ for(const o of ['menu', 'settings', 'pause', 'upgrade', 'over']) $(o).classList.toggle('show', o === id); },
  menuScene(){
    Zombies.reset();
    const types = ['normal', 'runner', 'brute', 'exploder', 'spitter', 'normal'];
    types.forEach((t, i) => { const a = -0.9 + i*0.36, r = 9 + (i % 2)*2.5; Zombies.spawn(t, Car.pos.x + Math.sin(a)*r, Car.pos.z - Math.cos(a)*r, 1, true); });
  },
  start(){
    Sfx.init(); Gyro.request(); Gyro.reset();
    if(IS_TOUCH && !IS_APP){ try { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if(r) r.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {}); } catch(e){} }
    Object.assign(Up, { dmgMul:1, rateMul:1, heatMul:1, barrels:1, pierce:0, ramMul:1, ramArmor:false, speedMul:1, boomEvery:0, leech:0, headMul:2, lv:{} });
    Car.reset(); Gun.reset(); Zombies.reset(); Waves.reset(); PL.clear(); PG.clear(); Acid.clear(); Blasts.clear(); Pickups.clear(); Tracers.clear(); BossLane.hide();
    this.score = 0; this.kills = 0; this.timeScale = 1; this.t = 0;
    $('dmgDirs').innerHTML = '';
    this.showOv(null); this.setState('play');
    if(!IS_TOUCH) lockPointer();
    releaseTouches();
    HUD.announce('准备战斗', IS_TOUCH ? (Gyro.has && S.gyro ? '转动手机瞄准 · 左摇杆移动 · 右下开火' : '滑动屏幕瞄准 · 左摇杆移动 · 右下开火') : '鼠标瞄准 · WASD 移动 · 左键开火', '#ffd28a');
    if(IS_TOUCH && S.gyro) setTimeout(() => { if(!Gyro.has && Game.state === 'play') HUD.toast('没有检测到陀螺仪：请滑动屏幕转动视角', 4); }, 1500);
  },
  pause(){
    if(this.state !== 'play') return;
    this.setState('pause'); this.showOv('pause'); Input.firing = false; releaseTouches(); Sfx.engine(0, false);
  },
  resume(){
    this.showOv(null); this.setState('play'); Gyro.reset();
    if(!IS_TOUCH) lockPointer();
  },
  quit(){
    this.unlockOk = true; if(document.pointerLockElement) document.exitPointerLock();
    Car.reset(); Car.sync(); Waves.reset(); Acid.clear(); Pickups.clear(); Tracers.clear(); Blasts.clear(); this.menuScene();
    this.setState('menu'); this.showOv('menu'); Sfx.engine(0, false); refreshMenu();
  },
  onKill(z, head){
    if(z.idle) return;
    this.kills++; this.score += Math.round(z.cfg.score*(head ? 1.5 : 1));
    if(Up.leech) Car.heal(Up.leech);
    const drop = z.type === 'boss' ? 1 : z.type === 'brute' ? 0.25 : 0.035;
    if(Math.random() < drop) Pickups.spawn(z.pos.x, z.pos.z);
    if(z.type === 'boss'){ HUD.announce('BOSS 已击败！', '+' + z.cfg.score + ' 分', '#ffd25a'); Cam.trauma(0.6); vibrate([60, 30, 60]); }
  },
  showUpgrade(){
    this.setState('upgrade'); Input.firing = false; releaseTouches(); Sfx.engine(0, false);
    this.unlockOk = true; if(document.pointerLockElement) document.exitPointerLock(); else this.unlockOk = false;
    $('upTitle').textContent = '第 ' + Waves.n + ' 波完成';
    const box = $('cards'); box.innerHTML = '';
    upgradeChoices().forEach((u, i) => {
      const lv = Up.lv[u.id] || 0, c = document.createElement('div'); c.className = 'card';
      c.innerHTML = `<div class="ic">${u.ic}</div><div class="nm">${u.nm}</div><div class="ds">${u.ds}</div><div class="lv">${u.max < 99 ? '等级 ' + lv + ' → ' + (lv + 1) : ''}</div>${IS_TOUCH ? '' : '<div class="k">按 ' + (i + 1) + '</div>'}`;
      c.onclick = () => { Sfx.click(); Up.lv[u.id] = lv + 1; u.f(); this.showOv(null); this.setState('play'); Waves.phase = 'wait'; Waves.t = 3; Gyro.reset(); if(!IS_TOUCH) lockPointer(); };
      box.appendChild(c);
    });
    this.showOv('upgrade');
  },
  gameOver(){
    this.setState('over'); Sfx.engine(0, false);
    this.unlockOk = true; if(document.pointerLockElement) document.exitPointerLock(); else this.unlockOk = false;
    const best = getBest(), nb = this.score > best; if(nb) setBest(this.score);
    $('stats').innerHTML = `<span>坚持到</span><b>第 ${Waves.n} 波</b><span>击杀</span><b>${this.kills}</b><span>得分</span><b>${this.score}</b><span>最高分</span><b>${Math.max(best, this.score)}${nb ? ' 🏆' : ''}</b>`;
    this.showOv('over');
  },
  step(dt){
    this.t += dt;
    Gyro.step(dt); Input.applyLook();
    Car.update(dt); Gun.update(dt);
    Zombies.update(dt); Acid.update(dt); Blasts.update(dt); Pickups.update(dt);
    if(!Car.dead) Waves.update(dt);
    if(Car.dead){ Car.deadT += dt/this.timeScale; if(Car.deadT > 2.2) this.gameOver(); }
    Sfx.engine(Math.hypot(Car.vel.x, Car.vel.z), !Car.dead);
  },
};
function refreshMenu(){
  $('ctrlHint').innerHTML = IS_TOUCH
    ? '<b>转动手机</b> 瞄准（陀螺仪），也可滑动屏幕微调<br><b>左下摇杆</b> 开车移动　<b>右下按钮</b> 按住开火<br>开车直接撞僵尸也能造成伤害'
    : '<b>鼠标</b> 瞄准　<b>WASD</b> 开车移动　<b>左键</b> 按住开火<br><b>Esc</b> 暂停　开车直接撞僵尸也能造成伤害';
  const b = getBest(); $('bestTxt').textContent = b ? '最高分 ' + b : '';
}

// 主循环
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  advance(Math.min(0.05, (now - last)/1000)); last = now;
}
function advance(raw){
  const dt = raw*Game.timeScale;
  if(Game.state === 'play') Game.step(dt);
  else if(Game.state === 'menu'){
    Game.menuT += raw; Zombies.update(raw);
    const a = Game.menuT*0.12;
    camera.position.set(Car.pos.x + Math.sin(a)*10, 3.8, Car.pos.z + Math.cos(a)*10);
    camera.lookAt(Car.pos.x, 1.3, Car.pos.z);
  }
  if(Game.state !== 'menu') Cam.update(raw);
  PL.update(raw*Game.timeScale); PG.update(raw*Game.timeScale); Tracers.update(raw);
  boomLight.intensity = damp(boomLight.intensity, 0, 8, raw);
  Car.sync();
  sunL.position.copy(Car.pos).add(SUN_OFF); sunL.target.position.copy(Car.pos);
  if(document.body.classList.contains('playing')) HUD.update(raw);
  camera.updateMatrixWorld(); window.__skyG.quaternion.copy(camera.quaternion).invert();
  renderer.clear();
  renderer.render(scene, camera);
  if(Game.state !== 'menu' && !Car.dead){ renderer.clearDepth(); renderer.render(gunScene, gunCam); }
}
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, S.hq ? 2 : 1.25));
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.fov = w/h < 1.2 ? 80 : 66; camera.updateProjectionMatrix();
  gunCam.aspect = w/h; gunCam.updateProjectionMatrix();
  // 竖屏/窄屏时枪往上抬一点，保持在画面下方中间
  gun.scale.setScalar(w/h < 1.5 ? 0.85 : 1);
}
function applyQuality(){
  renderer.shadowMap.enabled = S.hq; sunL.castShadow = S.hq;
  scene.traverse(o => { if(o.material){ (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.needsUpdate = true); } });
  resize();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('visibilitychange', () => { if(document.hidden){ Game.pause(); if(Sfx.ctx) Sfx.ctx.suspend(); } else if(Sfx.ctx) Sfx.ctx.resume(); });

/* =====================================================================
   16. 菜单 / 设置 绑定
   ===================================================================== */
const btn = (id, fn) => $(id).addEventListener('click', e => { e.stopPropagation(); Sfx.init(); Sfx.click(); fn(); });
let settingsBack = 'menu';
btn('bStart', () => Game.start());
btn('bSet', () => { settingsBack = 'menu'; openSettings(); });
btn('pResume', () => Game.resume());
btn('pSet', () => { settingsBack = 'pause'; openSettings(); });
btn('pRestart', () => Game.start());
btn('pQuit', () => Game.quit());
btn('oAgain', () => Game.start());
btn('oMenu', () => Game.quit());
btn('sBack', () => { saveS(); Game.showOv(settingsBack); });
btn('pauseBtn', () => Game.pause());
btn('calBtn', () => { Car.pitch = 0; Gyro.reset(); HUD.toast('视角已校准（水平）'); });
function openSettings(){
  const bind = (id, key, fmt=v => v) => {
    const el = $(id), out = el.parentElement.querySelector('output');
    if(el.type === 'checkbox') el.checked = !!S[key]; else { el.value = S[key]; if(out) out.textContent = fmt(+el.value); }
    el.oninput = () => {
      if(el.type === 'checkbox') S[key] = el.checked; else { S[key] = +el.value; if(out) out.textContent = fmt(+el.value); }
      if(key === 'vol') Sfx.setVol(S.vol);
      if(key === 'hq') applyQuality();
      saveS();
    };
  };
  bind('sGyro', 'gyro'); bind('sGyroSens', 'gyroSens', v => v.toFixed(1)); bind('sDragSens', 'dragSens', v => v.toFixed(1));
  bind('sMouseSens', 'mouseSens', v => v.toFixed(1)); bind('sVol', 'vol', v => Math.round(v*100)); bind('sHq', 'hq');
  Game.showOv('settings');
}

// 启动
Car.reset(); Car.sync(); Game.menuScene(); refreshMenu(); applyQuality();
$('loading').remove();
requestAnimationFrame(frame);
window.FP = { Game, Car, Gun, Zombies, Waves, Input, Up, Gyro, HUD, World, tick(sec, fn){ for(let i=0;i<sec*60;i++){ if(fn) fn(i/60); advance(1/60); } } };   // 调试用
</script>
</body>
