<!DOCTYPE html>
<!--
  火力战车 · FIREPOWER RIG
  第一人称转管机枪战车 × 方块僵尸（僵尸模型与数值来自 Blockade）
  手机：滑动屏幕转视角（轻度瞄准辅助；设置里可开陀螺仪）/ 左下摇杆移动 / 右下按钮开火
  调试：网址加 ?touch 可在电脑上强制触屏模式
  电脑：鼠标转动视角 / WASD 移动 / 左键开火 / Esc 暂停
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>火力战车 · Firepower Rig</title>
<style>
/* ===== 界面风格：沿用《极速栈道 Plank Rush》——深蓝圆角面板、粗边框 + 实心投影、橙色胶囊按钮、粗斜体标题 ===== */
:root{
  --bg:#0f1422;--panel:#171e30fa;--text:#fff;--muted:#b3bdd0;--line:#36415c;
  --accent:#ff7a00;--accent-hi:#ffa42e;--accent-lo:#c45400;--ink:#151009;--gold:#ffc93c;--bad:#ff4d45;
  --or:#ff7a00;--gn:#3ddc84;--yl:#ffc93c;--rd:#ff4d45;
  --num:'Bahnschrift','DIN Alternate','Roboto Condensed','sans-serif-condensed','Arial Narrow','Microsoft YaHei',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.34,1.56,.64,1);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);touch-action:none;
  font:16px/1.4 "Microsoft YaHei","PingFang SC","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;transition:transform .12s var(--ease),color .15s}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#touch{position:fixed;inset:0;z-index:1;touch-action:none;display:none}
body.playing.touch #touch{display:block}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none;display:none}
body.playing #hud{display:block}
body:not(.touch) .tOnly{display:none!important}
body.touch .pOnly{display:none!important}
.sa-l{left:calc(16px + var(--sl))}
.sa-r{right:calc(16px + var(--sr))}
.gi{display:inline-flex;align-items:center;justify-content:center}
.num{font-family:var(--num);font-weight:900;font-variant-numeric:tabular-nums}

/* ---------- 圆角底板：按钮 / 分段 / 图标按钮共用（实心投影，按下会沉下去） ---------- */
.btn,.icon-button,.seg button{position:relative;isolation:isolate;border:0;background:none}
.btn:before,.icon-button:before,.seg button:before{content:'';position:absolute;inset:0;z-index:-1;border-radius:999px;background:var(--bgc,#232c44);
  border:2px solid var(--bdc,var(--line));box-shadow:0 4px 0 var(--shc,#080b14b3);transition:background .15s,border-color .15s,box-shadow .12s}
.btn:active,.icon-button:active,.seg button:active{transform:translateY(3px)}
.btn:active:before,.icon-button:active:before{box-shadow:0 1px 0 var(--shc,#080b14b3)}
.btn{min-height:48px;padding:11px 24px;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:900;letter-spacing:1px;font-size:16px}
.btn:hover,.icon-button:hover{--bgc:#2e3956;--bdc:#fff}
.btn.primary{--bgc:var(--accent);--bdc:#ffc27a;--shc:var(--accent-lo);color:var(--ink)}
.btn.primary:before{background:linear-gradient(105deg,transparent 42%,#fff9 50%,transparent 58%) 160% 0/260% 100% no-repeat,linear-gradient(180deg,var(--accent-hi),var(--accent));animation:sheen 3.2s ease-in-out infinite}
.btn.ghost{--bgc:transparent;--bdc:transparent;--shc:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);--bdc:var(--text)}
.icon-button{display:inline-flex;justify-content:center;align-items:center;flex-shrink:0;width:46px;height:46px}

/* ---------- 覆盖层 / 面板 ---------- */
.ov{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:#080b148c;
  padding:calc(14px + var(--st)) calc(22px + var(--sr)) calc(14px + var(--sb)) calc(22px + var(--sl));animation:fadeIn .18s linear}
.ov.show{display:flex}
.ov.dim{background:#080b14c4}
.panel{position:relative;background:var(--panel);border:3px solid var(--line);border-radius:28px;box-shadow:0 8px 0 #080b1480;
  padding:20px 26px 24px;max-height:100%;overflow:auto;scrollbar-width:thin;scrollbar-color:#66717b transparent;animation:panelIn .32s var(--pop)}
h2{font-size:28px;line-height:1.15;font-weight:900;font-style:italic;letter-spacing:1px}
.panel-header{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.panel-header h2{white-space:nowrap}
.panel-header:after{content:'';flex:1;height:10px;margin-right:18px;background:radial-gradient(circle,var(--accent) 0 4px,transparent 4.5px) 0 50%/20px 10px repeat-x;opacity:.7;
  -webkit-mask-image:linear-gradient(90deg,#000,transparent 70%);mask-image:linear-gradient(90deg,#000,transparent 70%)}
.sub{color:var(--muted);font-size:14px;font-weight:700;margin:-8px 0 14px}

/* ---------- 主菜单：左侧标题 + 按钮，右边露出游戏画面 ---------- */
#menu{justify-content:flex-start;background:linear-gradient(100deg,#080b14f5 0%,#080b14d9 34%,#080b1459 62%,#080b141f);padding-left:calc(clamp(36px,8vw,120px) + var(--sl))}
.menu-content{width:min(520px,60vw)}
.title{margin-bottom:22px;animation:itemIn .45s var(--pop) both}
.title h1{font-size:clamp(52px,8vw,104px);font-weight:900;font-style:italic;letter-spacing:-1px;line-height:1.1;white-space:nowrap;text-shadow:0 5px 0 var(--accent),0 12px 30px #000a}
.title-en{display:inline-block;margin:12px 0 0 4px;padding:5px 18px 4px 22px;border-radius:999px;background:var(--accent);color:var(--ink);font:900 clamp(13px,1.8vw,19px)/1.2 var(--num);letter-spacing:5px}
html[lang=en] .title-en{letter-spacing:3px}
.tag{margin:0 0 18px 4px;color:var(--muted);font-size:14px;line-height:1.5;max-width:440px;animation:itemIn .45s .05s var(--pop) both}
.menu-actions{display:grid;gap:14px;width:min(310px,100%);margin-left:4px}
.menu-actions>*{animation:itemIn .4s var(--pop) both}
.menu-actions>:nth-child(1){animation-delay:.1s}.menu-actions>:nth-child(2){animation-delay:.17s}
.start-button{justify-content:space-between;min-height:62px;font-size:22px;padding:11px 28px}
.start-button .gi{animation:nudge 1.2s ease-in-out infinite}
.menu-actions>.secondary{justify-content:flex-start;--bgc:#171e30ee}
.ctrl{margin:18px 0 0 6px;font-size:13px;color:var(--muted);line-height:1.75}
.ctrl b{color:var(--accent-hi)}
.best{display:inline-flex;align-items:center;gap:10px;margin:12px 0 0 4px;padding:3px 6px 3px 16px;border-radius:999px;background:#0f1422cc;border:2px solid #ffffff2e;font-size:13px;font-weight:800;color:var(--muted)}
.best:empty{display:none}
.best b{padding:1px 12px;border-radius:999px;background:#fff;color:var(--ink);font-size:17px;box-shadow:0 3px 0 var(--accent)}
#bLang{position:absolute;top:calc(14px + var(--st));right:calc(18px + var(--sr));min-height:40px;padding:6px 18px;font-size:14px;--bgc:#171e30ee}

/* ---------- 设置 ---------- */
.set-panel{width:min(760px,100%)}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 32px}
.row{display:flex;align-items:center;gap:14px;min-height:50px;font-size:15px;font-weight:800;text-align:left}
.row>span:first-child{flex:1;white-space:nowrap}
.row output{min-width:38px;text-align:right;color:var(--accent-hi);font:900 19px/1 var(--num);font-variant-numeric:tabular-nums}
.row input[type=range]{-webkit-appearance:none;appearance:none;width:36%;height:40px;background:transparent;--p:50%;cursor:pointer;touch-action:pan-x}
.row input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--accent) var(--p),var(--line) var(--p))}
.row input[type=range]::-moz-range-track{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--accent) var(--p),var(--line) var(--p))}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-9px;border-radius:50%;border:4px solid #fff;background:var(--accent);box-shadow:0 3px 0 #080b14b3}
.row input[type=range]::-moz-range-thumb{width:22px;height:22px;border:4px solid #fff;border-radius:50%;background:var(--accent)}
.row input[type=checkbox]{-webkit-appearance:none;appearance:none;width:54px;height:30px;border-radius:999px;border:2px solid #6b7892;background:#232c44;position:relative;cursor:pointer;flex:none;transition:background .15s,border-color .15s}
.row input[type=checkbox]::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#c3ccdc;transition:transform .22s var(--pop),background .15s}
.row input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.row input[type=checkbox]:checked::after{transform:translateX(24px);background:#fff}
.row.full{grid-column:1/-1}
.seg{display:flex;gap:8px;padding-bottom:4px}
.seg button{min-height:40px;padding:6px 20px;font-weight:800;font-size:14px}
.seg button.on{color:var(--ink);--bgc:var(--accent);--bdc:#ffc27a;--shc:var(--accent-lo)}

/* ---------- 暂停 ---------- */
.pause-panel{width:350px;display:grid;gap:12px;padding:22px 32px 28px}
.pause-panel h2{margin-bottom:6px;font-size:34px}
.pause-panel .btn{animation:itemIn .3s var(--pop) both}
.pause-panel .btn:nth-child(3){animation-delay:.03s}.pause-panel .btn:nth-child(4){animation-delay:.06s}.pause-panel .btn:nth-child(5){animation-delay:.09s}

/* ---------- 强化三选一：卡片（选中/悬停变橙边，左上角白色号码牌） ---------- */
.up-panel{width:min(700px,100%)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-bottom:5px}
.card{position:relative;padding:3px;border-radius:22px;background:var(--line);box-shadow:0 5px 0 #080b14b3;cursor:pointer;touch-action:manipulation;
  transition:background .15s,transform .2s var(--pop);animation:itemIn .36s var(--pop) both}
.card-in{display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;padding:18px 12px 14px;border-radius:19px;background:#1c2438;text-align:center}
.card:hover,.card:active{background:var(--accent);transform:translateY(-4px)}
.plate{position:absolute;top:10px;left:10px;padding:0 11px;border-radius:999px;background:#fff;color:var(--ink);font:900 16px/1.45 var(--num);box-shadow:0 3px 0 var(--accent)}
.card .ic{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--ic,#555);box-shadow:0 4px 0 #080b14b3}
.card .nm{font-weight:900;font-size:18px;font-style:italic}
.card .ds{font-size:13px;color:var(--muted);line-height:1.45}
.card .lv{font-size:12px;color:var(--muted);margin-top:auto}
.pips{display:flex;gap:5px;margin-top:auto}
.pips i{width:10px;height:10px;border-radius:50%;background:#3b4662}
.pips i.on{background:var(--gold)}
.pips i.new{background:var(--accent);box-shadow:0 0 0 2px #fff;animation:blink .8s infinite}

/* ---------- 结算 ---------- */
.result-panel{width:min(640px,100%);padding:22px 32px 28px}
.result-status{display:inline-block;margin:0 0 10px;padding:2px 16px;border-radius:999px;background:var(--bad);color:#fff;font-weight:900;letter-spacing:2px}
.result-panel h2{font-size:34px}
.res{display:flex;gap:10px;margin:18px 0 20px}
.stat{flex:1;min-width:0;padding:8px 16px 10px;border-radius:18px;background:#0d1220;border:2px solid var(--line);animation:itemIn .34s var(--pop) both}
.stat:nth-child(2){animation-delay:.06s}.stat:nth-child(3){animation-delay:.12s}.stat:nth-child(4){animation-delay:.18s}
.stat>span{display:block;color:var(--muted);font-size:14px;white-space:nowrap}
.stat b{display:block;font:900 24px/1.2 var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.main{flex:1.5;border-color:var(--accent)}
.stat.main b{font-size:38px;color:var(--accent-hi)}
#newBest{display:none;margin-left:8px;padding:1px 10px;border-radius:999px;background:var(--gold);color:var(--ink);font:900 13px/1.5 "Microsoft YaHei",sans-serif;vertical-align:middle;animation:blink 1s infinite}
.result-actions{display:flex;gap:14px}
.result-actions .btn{flex:1;white-space:nowrap}

/* ---------- 战斗 HUD：深色半透明卡片 + 白色细边 ---------- */
.hud-surface{background:#0f1422e0;border:2px solid #ffffff2e;border-radius:18px}
.bar{position:relative;height:12px;border-radius:999px;background:#0f1422d9;border:2px solid #ffffff4d;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:999px;transition:width .15s}
.bar>i.gh{background:rgba(255,255,255,.75);transition:width .45s .2s}
#hpBox{position:absolute;top:calc(12px + var(--st));display:flex;align-items:center;gap:10px;padding:7px 14px 7px 11px}
#heart{color:var(--rd);display:flex}
#heart.low{animation:beat .6s infinite}
#hpBar{width:min(20vw,220px);height:14px}
#hpFill{background:var(--gn)}
#hpTxt{font-size:20px;min-width:34px;line-height:1}
#scoreRow{position:absolute;top:calc(62px + var(--st));display:flex;align-items:center;gap:10px;padding:3px 14px 3px 5px;border-radius:999px;font-size:13px;font-weight:800;color:var(--muted)}
#scoreTxt{padding:0 10px;border-radius:999px;background:#fff;color:var(--ink);font:900 16px/1.4 var(--num);box-shadow:0 2px 0 var(--accent);transform-origin:0 50%}
#scoreTxt.bump{animation:bump .25s ease-out}
#waveBox{position:absolute;left:50%;top:calc(12px + var(--st));transform:translateX(-50%);text-align:center;padding:5px 18px 7px;min-width:170px}
#waveTxt{font-size:19px;font-weight:900;font-style:italic;letter-spacing:1px}
#remBar{height:10px;margin:4px 0 3px}
#remBar>i{background:linear-gradient(90deg,var(--accent),var(--accent-hi))}
#subTxt{font:900 13px/1.2 var(--num);color:var(--accent-hi);letter-spacing:.5px}
#bossBox{position:absolute;left:50%;top:calc(98px + var(--st));transform:translateX(-50%);width:min(44vw,400px);display:none;padding:6px 14px 9px}
#bossName{display:flex;justify-content:space-between;font-size:13px;font-weight:900;font-style:italic;color:#ffb2a6;margin-bottom:5px;letter-spacing:1px}
#bossPct{font-style:normal}
#bossBar>i{background:linear-gradient(90deg,#c8261f,var(--bad))}
#radar{position:absolute;top:calc(12px + var(--st));width:104px;height:104px;border-radius:18px;border:2px solid #ffffff2e}
.hbtn{position:absolute;pointer-events:auto;width:46px;height:46px;color:#fff;--bgc:#0f1422e0;--bdc:#ffffff66;--shc:transparent}
#pauseBtn{top:calc(12px + var(--st))}
#calBtn{top:calc(66px + var(--st))}
body:not(.gyro-on) #calBtn,body:not(.gyro-on) .gyroOnly{display:none!important}

/* 准星 [ · ]：有瞄准辅助目标时变红收紧 */
#cross{position:absolute;left:50%;top:50%;width:0;height:0;--g:14px}
#cross .br{position:absolute;top:-14px;width:8px;height:28px;border:2.5px solid rgba(255,255,255,.95);border-radius:3px;filter:drop-shadow(0 0 2px rgba(0,0,0,.7));transition:border-color .1s}
#cross .l{left:calc(-1*var(--g) - 8px);border-right:none;border-radius:3px 0 0 3px}
#cross .r{left:var(--g);border-left:none;border-radius:0 3px 3px 0}
#cross .dot{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.7))}
#cross.hot .br{border-color:var(--accent-hi)}
#cross.lock .br{border-color:var(--rd)}
#cross.lock .dot{background:var(--rd)}
#hitm{position:absolute;left:0;top:0;opacity:0}
#hitm i{position:absolute;width:3px;height:10px;border-radius:2px;background:#fff;left:-1.5px;top:-5px}
#hitm i:nth-child(1){transform:rotate(45deg) translateY(-16px)}
#hitm i:nth-child(2){transform:rotate(135deg) translateY(-16px)}
#hitm i:nth-child(3){transform:rotate(225deg) translateY(-16px)}
#hitm i:nth-child(4){transform:rotate(315deg) translateY(-16px)}
#hitm.kill i{background:var(--rd);height:13px}
#hitm.head i{background:var(--yl)}
#heatBox{position:absolute;left:50%;top:calc(50% + 30px);transform:translateX(-50%);width:80px;text-align:center}
#heatBar{height:9px;border-width:1.5px}
#heatBar>i{background:var(--yl)}
#heatBar.warm>i{background:var(--accent)}
#heatBar.over>i{background:var(--bad)}
#heatTxt{font-size:13px;font-weight:900;font-style:italic;color:#fff;opacity:0;letter-spacing:2px;margin-top:4px;text-shadow:0 2px 0 #c8261f,0 2px 6px #000}
#pops{position:absolute;left:50%;top:50%;width:0;height:0}
.pop{position:absolute;left:26px;top:-38px;font:900 18px/1 var(--num);white-space:nowrap;text-shadow:0 2px 0 #000a,0 2px 6px #000a;animation:pop .8s ease-out forwards}
#dmgDirs{position:absolute;left:50%;top:50%;width:0;height:0}
.dd{position:absolute;left:0;top:0;width:0;height:0}
.dd span{position:absolute;left:-22px;top:-118px;color:var(--rd);filter:drop-shadow(0 0 5px rgba(255,40,40,.7))}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,#a00b 100%);opacity:0}
/* 大字公告：粗斜体 + 橙色实心投影 */
#ann{position:absolute;left:16px;right:16px;top:24%;text-align:center;opacity:0}
#ann.drop{animation:drop .32s var(--pop)}
#annT{font-size:clamp(34px,6.4vw,66px);font-weight:900;font-style:italic;letter-spacing:1px;line-height:1.1;text-shadow:0 4px 0 var(--accent),0 6px 18px #000}
#annS{font-size:16px;font-weight:800;margin-top:12px;color:#fff;text-shadow:0 2px 8px #000}
#toast{position:absolute;left:50%;top:calc(50% + 72px);transform:translateX(-50%);background:#0f1422f0;border:2px solid #ffffff2e;border-radius:999px;
  padding:8px 20px;font-size:15px;font-weight:800;max-width:80vw;opacity:0;transition:opacity .15s;white-space:nowrap}
#clickHint{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:#0f1422f0;border:2px solid var(--accent);padding:10px 22px;border-radius:999px;font-weight:900;display:none}

/* 左下摇杆 / 右下开火（和《极速栈道》刹车键同款：深色圆 + 白色粗边；按下变橙） */
#stick{position:absolute;left:calc(40px + var(--sl));bottom:calc(26px + var(--sb));width:150px;height:150px;border-radius:50%;
  background:#0f142280;border:4px solid #ffffffb3;box-shadow:0 5px 0 #080b1466}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:linear-gradient(180deg,var(--accent-hi),var(--accent));border:4px solid #fff;box-shadow:0 4px 0 var(--accent-lo)}
#fireBtn{position:absolute;right:calc(40px + var(--sr));bottom:calc(32px + var(--sb));width:124px;height:124px;border-radius:50%;
  background:#0f1422e6;border:4px solid #fff;box-shadow:0 5px 0 #080b1499;transition:transform .1s var(--ease),background .08s,box-shadow .1s}
#fireBtn svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#fireBtn svg.ring circle:first-child{stroke:transparent}
#fireBtn .ic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--accent-hi);display:flex}
#fireBtn.on{background:var(--accent);border-color:#ffe0bd;transform:translateY(4px) scale(.96);box-shadow:0 1px 0 #080b1499}
#fireBtn.on .ic{color:var(--ink)}
#fireBtn.hot{background:#c8261f;border-color:#ffb2a6}
#fireBtn.hot .ic{color:#fff}

#rotate{position:fixed;inset:0;z-index:9;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:24px;font-size:22px;font-weight:900;font-style:italic;letter-spacing:2px;text-align:center}
@media (orientation:portrait){ body.touch #rotate{display:flex} }
#rotate .ph{width:60px;height:100px;border:5px solid var(--accent);border-radius:12px;animation:rot 2s infinite}
#loading{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;font-style:italic;color:#fff;letter-spacing:4px}

@keyframes fadeIn{from{opacity:0}}

<script>
'use strict';
/* =====================================================================
   0. 工具
   ===================================================================== */
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a ? a : (v>b ? b : v);
const lerp = (a,b,t) => a + (b-a)*t;
const damp = (a,b,k,dt) => a + (b-a)*(1-Math.exp(-k*dt));
const wrapA = a => { while(a > Math.PI) a -= Math.PI*2; while(a < -Math.PI) a += Math.PI*2; return a; };
const angleDamp = (a,b,k,dt) => a + wrapA(b-a)*(1-Math.exp(-k*dt));
function seeded(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let _rmin = 0, _rmax = 0;
function _slab(o, d, a, b){
  if(Math.abs(d) < 1e-9) return o >= a && o <= b;
  let t1 = (a - o)/d, t2 = (b - o)/d; if(t1 > t2){ const t = t1; t1 = t2; t2 = t; }
  if(t1 > _rmin) _rmin = t1; if(t2 < _rmax) _rmax = t2; return _rmin <= _rmax;
}
function rayAABB(o, d, x0,y0,z0, x1,y1,z1){
  _rmin = -Infinity; _rmax = Infinity;
  if(!_slab(o.x, d.x, x0, x1) || !_slab(o.y, d.y, y0, y1) || !_slab(o.z, d.z, z0, z1) || _rmax < 0) return -1;
  return _rmin > 0 ? _rmin : 0;
}

/* ---- UI 图标：矢量 SVG（现代手游风），[内容, 是否填充, 卡片底色] ---- */
const sp = d => `<path d="${d}"/>`;
const ICON = {
  back:[sp('M15 5l-7 7 7 7'), false],
  next:[sp('M4.5 12h14M13 6l6 6-6 6'), false],
  play:[sp('M7 4.5v15l12-7.5z'), true],
  gear:['<circle cx="12" cy="12" r="3.3"/>' + sp('M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1'), false],
  heart:[sp('M12 20.5s-8-5-8-11a4.5 4.5 0 0 1 8-2.8 4.5 4.5 0 0 1 8 2.8c0 6-8 11-8 11z'), true],
  pause:['<rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/>', true],
  cal:['<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/>' + sp('M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4'), false],
  arrow:[sp('M4 16l8-8 8 8'), false],
  fire:[sp('M12 1.8l2.3 6.4 6.6-2.4-4 5.6 5.3 4.4-6.8-.4L12 22.2l-3.4-6.8-6.8.4 5.3-4.4-4-5.6 6.6 2.4z'), true],
  dmg:[sp('M12 3c2.5 2.2 3.5 4.5 3.5 7.5V18h-7v-7.5C8.5 7.5 9.5 5.2 12 3zM8 21h8'), false, '#ff7a2f'],
  rate:[sp('M13 2L4.5 13.5H11L10 22l8.5-11.5H12z'), true, '#f0a800'],
  cool:[sp('M12 2v20M3.3 7l17.4 10M20.7 7L3.3 17M9 3.5l3 2.2 3-2.2M9 20.5l3-2.2 3 2.2'), false, '#2f9cf0'],
  armor:[sp('M12 3l8 3v6c0 5-3.5 8.2-8 9-4.5-.8-8-4-8-9V6z'), false, '#5b6ef5'],
  repair:[sp('M12 5v14M5 12h14'), false, '#25b865'],
  twin:[sp('M3 7h13M3 12h13M3 17h13M19.5 7h1.5M19.5 12h1.5M19.5 17h1.5'), false, '#7a8496'],
  pierce:[sp('M3 12h17M14 6l6 6-6 6M7.5 8v8'), false, '#f08a2a'],
  ram:[sp('M3 6h8l10 6-10 6H3zM7 9.5v5'), false, '#9a7050'],
  engine:[sp('M4 6l6 6-6 6M12 6l6 6-6 6'), false, '#14b4b4'],
  boom:['<circle cx="10" cy="14" r="7"/>' + sp('M15 9l3-3M19.5 1.5v2M22.5 4.5h-2M21.5 2.5l-1.2 1.2'), false, '#e8404f'],
  leech:[sp('M12 20.5s-8-5-8-11a4.5 4.5 0 0 1 8-2.8 4.5 4.5 0 0 1 8 2.8c0 6-8 11-8 11zM12 9.5v5.5M9.2 12.2h5.6'), false, '#25b865'],
  head:['<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/>', false, '#e8404f'],
};
const ico = (k, size=24) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${ICON[k][1] ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[k][0]}</svg>`;

const IS_TOUCH = /[?&]touch\b/.test(location.search) || (('ontouchstart' in window || navigator.maxTouchPoints > 0) && matchMedia('(pointer: coarse)').matches);
const IS_APP = !!window.Capacitor;
if(IS_TOUCH) document.body.classList.add('touch');

/* =====================================================================
   1. 设置（localStorage）
   ===================================================================== */
const S = { v:2, gyro:false, gyroSens:1.5, dragSens:1.0, assist:true, mouseSens:1.0, vol:0.8, hq:!IS_TOUCH, lang:/^zh/i.test(navigator.language || '') ? 'zh' : 'en' };
try {
  const old = JSON.parse(localStorage.getItem('fp_settings') || '{}');
  if(old.v !== 2){ delete old.gyro; delete old.dragSens; old.v = 2; }   // v1 默认陀螺仪；v2 起默认滑屏
  Object.assign(S, old);
} catch(e){}
const T = (zh, en) => S.lang === 'en' ? en : zh;   // 双语文本
const saveS = () => { try { localStorage.setItem('fp_settings', JSON.stringify(S)); } catch(e){} };
const getBest = () => { try { return +localStorage.getItem('fp_best') || 0; } catch(e){ return 0; } };
const setBest = v => { try { localStorage.setItem('fp_best', v); } catch(e){} };

/* =====================================================================
   2. 音效（WebAudio 合成，无外部文件）
   ===================================================================== */
const Sfx = {
  ctx:null, out:null, nb:null, eng:null,
  init(){
    if(this.ctx){ if(this.ctx.state !== 'running') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const c = this.ctx = new AC();
    this.out = c.createGain(); this.out.gain.value = S.vol;
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    this.out.connect(comp); comp.connect(c.destination);
    const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    this.nb = b;
    const eo = c.createOscillator(), eo2 = c.createOscillator(), ef = c.createBiquadFilter(), eg = c.createGain();
    eo.type = 'sawtooth'; eo.frequency.value = 40; eo2.type = 'square'; eo2.frequency.value = 20;
    ef.type = 'lowpass'; ef.frequency.value = 240; eg.gain.value = 0;
    eo.connect(ef); eo2.connect(ef); ef.connect(eg); eg.connect(this.out); eo.start(); eo2.start();
    this.eng = { eo, eo2, ef, eg };
  },
  setVol(v){ if(this.out) this.out.gain.value = v; },
  dest(pan){
    if(!pan || !this.ctx.createStereoPanner) return this.out;
    const p = this.ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); p.connect(this.out); return p;
  },
  noise(dur, vol, type, freq, q, pan, attack=0.002){
    if(!this.ctx || vol < 0.003) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nb; s.loop = true; f.type = type; f.frequency.value = freq; if(q) f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.dest(pan)); s.start(t, Math.random()*0.6); s.stop(t + dur + 0.05);
  },
  tone(type, f0, f1, dur, vol, pan, attack=0.003, delay=0){
    if(!this.ctx || vol < 0.003) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.dest(pan)); o.start(t); o.stop(t + dur + 0.05);
  },
  // 位置 → 音量 / 声像（相对摄像机）
  spatial(p, maxD=60){
    const dx = p.x - camera.position.x, dz = p.z - camera.position.z, d = Math.hypot(dx, dz) || 1;
    const rx = (dx*Math.cos(Car.yaw) - dz*Math.sin(Car.yaw))/d;
    return { vol:clamp(1 - d/maxD, 0, 1), pan:rx*0.8 };
  },
  shot(){ this.noise(0.08, 0.26, 'bandpass', 1700 + Math.random()*500, 0.9); this.noise(0.14, 0.2, 'lowpass', 650); this.tone('sine', 170, 45, 0.09, 0.3); },
  hit(head){ this.tone('square', head ? 1900 : 1250, head ? 1500 : 950, 0.035, head ? 0.09 : 0.06); },
  kill(big){ this.noise(0.26, 0.3, 'lowpass', big ? 380 : 800); this.tone('triangle', big ? 120 : 210, 45, 0.22, 0.22); },
  boom(v=1, pan=0){ this.noise(1.3, 0.75*v, 'lowpass', 520, 0, pan, 0.004); this.tone('sine', 95, 28, 0.7, 0.6*v, pan); this.noise(0.25, 0.35*v, 'highpass', 2200, 0, pan); },
  hurt(){ this.tone('sawtooth', 140, 55, 0.2, 0.22); this.noise(0.18, 0.3, 'lowpass', 900); },
  thud(v){ this.tone('sine', 120, 38, 0.2, 0.45*v); this.noise(0.14, 0.35*v, 'lowpass', 700); },
  clank(v){ this.tone('square', 320, 180, 0.12, 0.12*v); this.noise(0.1, 0.25*v, 'bandpass', 2600, 2); },
  groan(v, pan, pitch=1){
    if(!this.ctx || v < 0.03) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(), l = c.createOscillator(), lg = c.createGain();
    const f0 = rand(70, 115)*pitch, dur = rand(0.6, 1.1);
    o.type = 'sawtooth'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0*0.72, t + dur);
    l.frequency.value = rand(5, 8); lg.gain.value = f0*0.06; l.connect(lg); lg.connect(o.frequency);
    f.type = 'lowpass'; f.frequency.value = 520; f.Q.value = 5;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.13*v, t + 0.15); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(this.dest(pan)); o.start(t); l.start(t); o.stop(t + dur + 0.05); l.stop(t + dur + 0.05);
  },
  pickup(){ [660, 880, 1320].forEach((f, i) => this.tone('triangle', f, f, 0.12, 0.16, 0, 0.005, i*0.07)); },
  overheat(){ this.noise(0.7, 0.2, 'highpass', 3200); this.tone('square', 900, 300, 0.25, 0.06); },
  click(){ this.tone('square', 880, 880, 0.03, 0.05); },
  horn(){ this.tone('sawtooth', 220, 210, 0.7, 0.1, 0, 0.05); this.tone('sawtooth', 277, 262, 0.7, 0.08, 0, 0.05); },
  spit(v, pan){ this.noise(0.3, 0.3*v, 'bandpass', 700, 3, pan); },
  splat(v, pan){ this.noise(0.3, 0.3*v, 'lowpass', 1300, 0, pan); },
  beep(v, pan){ this.tone('square', 1500, 1500, 0.06, 0.08*v, pan); },
  roar(){ this.tone('sawtooth', 90, 45, 1.4, 0.3, 0, 0.1); this.noise(1.2, 0.3, 'lowpass', 400, 0, 0, 0.1); },
  engine(speed, on){

  constructor(max, mat){
    this.max = max; this.mesh = new THREE.InstancedMesh(boxGeo, mat, max);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); this.mesh.frustumCulled = false;
    this.items = []; this.free = []; this.c = new THREE.Color(1, 1, 1);
    for(let i=0;i<max;i++){ this.mesh.setMatrixAt(i, ZERO_M); this.mesh.setColorAt(i, this.c); this.free.push(max - 1 - i); }
    this.m = new THREE.Matrix4(); this.q = new THREE.Quaternion(); this.e = new THREE.Euler(); this.s = new V3();
    scene.add(this.mesh);
  }
  spawn(x, y, z, vx, vy, vz, size, color, life, grav=22, bounce=0.35, drag=0){
    if(!this.free.length) return;
    const i = this.free.pop();
    this.items.push({ i, p:new V3(x, y, z), v:new V3(vx, vy, vz), size, life, max:life, grav, bounce, drag, rx:rand(-8, 8), rz:rand(-8, 8), a:Math.random()*6 });
    this.c.setHex(color); if(typeof color === 'object') this.c.copy(color);
    this.mesh.setColorAt(i, this.c); this.mesh.instanceColor.needsUpdate = true;
  }
  spawnC(x, y, z, vx, vy, vz, size, c3, life, grav, bounce, drag){
    if(!this.free.length) return;
    const i = this.free[this.free.length - 1];
    this.spawn(x, y, z, vx, vy, vz, size, 0xffffff, life, grav, bounce, drag);
    this.mesh.setColorAt(i, c3);
  }
  update(dt){
    const L = this.items;
    for(let k=L.length-1;k>=0;k--){
      const it = L[k]; it.life -= dt;
      if(it.life <= 0){ this.mesh.setMatrixAt(it.i, ZERO_M); this.free.push(it.i); L[k] = L[L.length - 1]; L.pop(); continue; }
      it.v.y -= it.grav*dt; if(it.drag){ const f = Math.exp(-it.drag*dt); it.v.multiplyScalar(f); }
      it.p.addScaledVector(it.v, dt);
      const hs = it.size*0.5;
      if(it.p.y < hs && it.grav > 0){ it.p.y = hs; it.v.y *= -it.bounce; it.v.x *= 0.6; it.v.z *= 0.6; it.rx *= 0.5; it.rz *= 0.5; }
      it.a += dt;
      const k2 = Math.min(1, it.life/(it.max*0.35));
      this.e.set(it.a*it.rx, 0, it.a*it.rz); this.q.setFromEuler(this.e); this.s.setScalar(it.size*k2);
      this.m.compose(it.p, this.q, this.s); this.mesh.setMatrixAt(it.i, this.m);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
  clear(){ for(const it of this.items){ this.mesh.setMatrixAt(it.i, ZERO_M); this.free.push(it.i); } this.items.length = 0; this.mesh.instanceMatrix.needsUpdate = true; }
}

/* ---- 合并建模：很多方块/圆柱合成一个网格（顶点色），手机上也只多几个 draw call ---- */
const MGEO = { box:new THREE.BoxGeometry(1, 1, 1).toNonIndexed() };
const cylG = (seg, top=1) => MGEO['c' + seg + '_' + top] || (MGEO['c' + seg + '_' + top] = new THREE.CylinderGeometry(0.5*top, 0.5, 1, seg).toNonIndexed());
function Merge(){
  const pos = [], nor = [], uv = [], col = [], m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), c = new THREE.Color(), v = new V3(), s = new V3();
  const AX = { x:[0, 0, -Math.PI/2], y:[0, 0, 0], z:[Math.PI/2, 0, 0] };
  const api = {
    add(geo, color, x, y, z, sx, sy, sz, rx=0, ry=0, rz=0){
      const g = geo.clone(); m.compose(v.set(x, y, z), q.setFromEuler(e.set(rx, ry, rz)), s.set(sx, sy, sz)); g.applyMatrix4(m);
      c.set(color); const n = g.attributes.position.count;
      for(let i=0;i<n*3;i++){ pos.push(g.attributes.position.array[i]); nor.push(g.attributes.normal.array[i]); }
      for(let i=0;i<n*2;i++) uv.push(g.attributes.uv.array[i]);
      for(let i=0;i<n;i++) col.push(c.r, c.g, c.b);
      g.dispose(); return api;
    },
    box(w, h, d, x, y, z, color, rx, ry, rz){ return api.add(MGEO.box, color, x, y, z, w, h, d, rx, ry, rz); },
    // 圆柱（axis：沿哪个轴）；top<1 就是锥台，top=0 是尖锥
    cyl(r, len, x, y, z, color, axis='y', seg=10, top=1){ const a = AX[axis]; return api.add(cylG(seg, top), color, x, y, z, r*2, len, r*2, a[0], a[1], a[2]); },
    mesh(mat, shadow=true){
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      g.computeBoundingSphere();
      const me = new THREE.Mesh(g, mat); me.castShadow = shadow; me.receiveShadow = shadow; return me;
    },
  };
  return api;
}

        if(dd < K.near){ mx = -mx; mz = -mz; sp *= K.backMul; }

        z.castT -= dt;
        if(z.chargeT >= 0){

        } else if(z.castT <= 0 && dd < 34 && !Car.dead){ z.chargeT = 0; }

      // Boss：蓄力冲锋
      if(cfg.charge) ai = this.bossAI(z, dt, dist, dx, dz);
      if(ai){ sp = ai.sp; mx = ai.mx; mz = ai.mz; }
      // 绕开障碍

      if(z.stagger > 0) sp *= 0.25;
      // 互相分开
      for(const o of list){
        if(o === z || o.dead || o.rise < 1) continue;
        const ox = z.pos.x - o.pos.x, oz = z.pos.z - o.pos.z, rr = (z.r + o.r)*1.15, d2 = ox*ox + oz*oz;
        if(d2 < rr*rr && d2 > 1e-6){ const d = Math.sqrt(d2), push = (rr - d)*0.5*(o.s*o.s/(z.s*z.s + o.s*o.s))*2; z.pos.x += ox/d*push*Math.min(1, dt*10); z.pos.z += oz/d*push*Math.min(1, dt*10); }

      const kd = Math.exp(-6*dt); z.kb.x *= kd; z.kb.z *= kd;

      } else {
        z.pos.y = Math.max(0, z.pos.y - dt*6);
        const n = World.pushOut(z.pos, z.r);

      }
      z.pos.x = clamp(z.pos.x, -ARENA + z.r, ARENA - z.r); z.pos.z = clamp(z.pos.z, -ARENA + z.r, ARENA - z.r);
      // 不能穿进战车
      const cp2 = carClosest(z.pos.x, z.pos.z), ex = z.pos.x - cp2.x, ez = z.pos.z - cp2.z, ed = Math.hypot(ex, ez) || 0.001, minD = CAR_R + z.r;
      if(ed < minD && !Car.dead){

        if(!z.dead){ z.pos.x = cp2.x + nx*minD; z.pos.z = cp2.z + nz*minD; }
        if(z.dead) continue;
      }
      // 近战
      if(cfg.damage > 0 && !ai && dist < CAR_R + z.r + 0.5 && !Car.dead){
        z.attackT -= dt;

  _ai:{ sp:0, mx:0, mz:0, face:false },

function explode(p, o){
  FX.fire(p, o.radius);
  boomLight.position.set(p.x, p.y + 1.5, p.z); boomLight.intensity = 4;
  const d = Math.hypot(p.x - Car.pos.x, p.z - Car.pos.z), s = Sfx.spatial(p, 90);
  Sfx.boom(Math.max(0.25, s.vol), s.pan); Cam.trauma(clamp(1.1 - d/25, 0.1, 0.8));
  for(const z of Zombies.list.slice()){
    if(z.dead || z.rise < 1) continue;
    const dx = z.pos.x - p.x, dz = z.pos.z - p.z, dd = Math.hypot(dx, dz), R = o.radius + z.r;
    if(dd < R && o.zDmg > 0){
      const f = 1 - dd/R*0.6, dir = new V3(dx/(dd || 1), 0, dz/(dd || 1));
      if(z.cfg.blast && z.fuseT < 0){ z.fuseT = z.cfg.blast.fuse*0.6; }   // 连锁：被炸到的自爆僵尸立刻开始倒数
      Zombies.damage(z, o.zDmg*f*Up.dmgMul, dir, 8*f, false, z.pos, true);
    }
  }
  if(o.pDmg > 0 && !Car.dead){
    const cp = carClosest(p.x, p.z), dd = Math.hypot(cp.x - p.x, cp.z - p.z), R = o.radius + CAR_R*0.5;
    if(dd < R){ Car.damage(o.pDmg*(1 - dd/R*0.5), p); const nx = (Car.pos.x - p.x)/(d || 1), nz = (Car.pos.z - p.z)/(d || 1); Car.vel.x += nx*6; Car.vel.z += nz*6; }
  }
}

    for(let i=this.list.length-1;i>=0;i--){
      const tr = this.list[i]; tr.t += dt;
      const head = Math.min(tr.len, tr.t*320), tail = Math.max(0, head - 7);
      if(tail >= tr.len - 0.01 || tr.t > 0.6){ scene.remove(tr.m); this.pool.push(tr.m); this.list.splice(i, 1); continue; }
      const L = Math.max(0.01, head - tail), w = 0.045;
      tr.m.position.copy(tr.a).addScaledVector(tr.d, tail);
      tr.m.lookAt(tr.m.position.x + tr.d.x, tr.m.position.y + tr.d.y, tr.m.position.z + tr.d.z);
      tr.m.scale.set(w, w, L);
    }
  },
  clear(){ for(const tr of this.list){ scene.remove(tr.m); this.pool.push(tr.m); } this.list.length = 0; },
};

const Car = {
  pos:new V3(), vel:new V3(), yaw:0, pitch:0, body:0, hp:100, maxHp:100, dead:false, deadT:0, hurtT:0, ghost:100,
  reset(){ this.pos.set(0, 0, 8); this.vel.set(0, 0, 0); this.yaw = 0; this.pitch = 0; this.body = 0; this.maxHp = 100; this.hp = 100; this.ghost = 100; this.dead = false; this.deadT = 0; carG.visible = true; ramSpikes.visible = !!Up.lv.ram; },
  heal(n){ this.hp = Math.min(this.maxHp, this.hp + n); },
  damage(n, from, acid){
    if(this.dead || Game.state !== 'play') return;
    this.hp -= n; this.hurtT = 1;
    HUD.dmgFrom(from); Cam.trauma(0.25 + n/80); Sfx.hurt(); vibrate(acid ? 30 : 45);
    if(this.hp <= 0){ this.hp = 0; this.die(); }
  },
  die(){
    this.dead = true; this.deadT = 0; Input.firing = false;
    explode(this.pos.clone().setY(1.2), { radius:6, zDmg:300, pDmg:0 });
    FX.fire(this.pos.clone().setY(1.5), 6); Game.timeScale = 0.35; vibrate([80, 40, 160]);
  },
  // 撞击僵尸（nx,nz：从车指向僵尸的法线）
  ram(z, nx, nz){
    const rel = this.vel.x*nx + this.vel.z*nz;
    if(rel > 3.2 && z.ramCd <= 0){
      z.ramCd = 0.45;
      const heavy = z.cfg.heavy, dmg = (rel - 2.2)*13*Up.ramMul*(z.type === 'boss' ? 0.4 : 1);
      const killed = Zombies.damage(z, dmg, new V3(nx, 0, nz), heavy ? 4 : rel*1.6, false, z.pos, false);
      if(killed || !heavy){ this.vel.x -= nx*rel*0.3; this.vel.z -= nz*rel*0.3; Sfx.thud(0.6); Cam.trauma(0.12); }
      else { this.vel.x -= nx*rel*1.4; this.vel.z -= nz*rel*1.4; Sfx.thud(1); Cam.trauma(0.35); if(!Up.ramArmor) this.damage(Math.round(rel*0.8), z.pos); }
      if(z.cfg.blast && !z.dead) z.fuseT = Math.max(z.fuseT, z.cfg.blast.fuse - 0.05);   // 撞自爆僵尸 → 当场爆
      vibrate(25);
    } else if(rel > 0){ this.vel.x -= nx*rel*0.5; this.vel.z -= nz*rel*0.5; }
  },
  update(dt){
    if(this.dead){ this.vel.multiplyScalar(Math.exp(-2*dt)); this.pos.addScaledVector(this.vel, dt); return; }
    const mv = Input.moveVec(), maxS = 11*Up.speedMul;
    const fx = -Math.sin(this.yaw), fz = -Math.cos(this.yaw), rx = Math.cos(this.yaw), rz = -Math.sin(this.yaw);
    const tx = (fx*mv.y + rx*mv.x)*maxS, tz = (fz*mv.y + rz*mv.x)*maxS, k = (mv.x || mv.y) ? 2.4 : 1.6;
    this.vel.x = damp(this.vel.x, tx, k, dt); this.vel.z = damp(this.vel.z, tz, k, dt);
    this.pos.addScaledVector(this.vel, dt);
    // 与障碍碰撞（车身前后两个圆）
    const bf = -Math.sin(this.body), bz = -Math.cos(this.body);
    for(const s of [CAR_HALF, -CAR_HALF]){
      const p = { x:this.pos.x + bf*s, z:this.pos.z + bz*s }, ox = p.x, oz = p.z;
      const n = World.pushOut(p, CAR_R);
      if(n){
        this.pos.x += p.x - ox; this.pos.z += p.z - oz;
        const vn = this.vel.x*n.x + this.vel.z*n.z;
        if(vn < 0){ this.vel.x -= n.x*vn*1.2; this.vel.z -= n.z*vn*1.2; if(vn < -5){ Sfx.clank(clamp(-vn/10, 0.3, 1)); Cam.trauma(clamp(-vn/30, 0.1, 0.4)); FX.debris(new V3(p.x - n.x*CAR_R, 1, p.z - n.z*CAR_R), 0x8a8070, 5); } }
      }
    }
    const lim = ARENA - 2.6; this.pos.x = clamp(this.pos.x, -lim, lim); this.pos.z = clamp(this.pos.z, -lim, lim);
    // 车身朝向：朝移动方向；反向时倒车
    const sp = Math.hypot(this.vel.x, this.vel.z);
    if(sp > 0.6){
      const vy = Math.atan2(-this.vel.x, -this.vel.z), diff = Math.abs(wrapA(vy - this.body));
      this.body = angleDamp(this.body, diff > 1.9 ? vy + Math.PI : vy, 3.2*Math.min(1, sp/4), dt);
    }
    const fwd = this.vel.x*bf + this.vel.z*bz;
    for(const w of carWheels) w.rotation.x -= fwd*dt/0.5;
    if(sp > 4 && Math.random() < dt*sp*1.6) FX.dust(new V3(this.pos.x - bf*1.6 + rand(-1, 1), 0.2, this.pos.z - bz*1.6 + rand(-1, 1)), 1, 0x9a8a68, 0.45);
    this.hurtT = Math.max(0, this.hurtT - dt*1.8);
    this.ghost = this.ghost > this.hp ? Math.max(this.hp, this.ghost - dt*40) : this.hp;
  },
  sync(){ carG.position.copy(this.pos); carG.rotation.y = this.body; turretGun.visible = this.dead && this.deadT > 0.4; turretGun.rotation.y = this.yaw - this.body; },
};

const Gun = {
  heat:0, over:false, fireT:0, spin:0, flashT:0, kick:0, shots:0, swayX:0, swayY:0, idleT:0,
  reset(){ this.heat = 0; this.idleT = 0; this.over = false; this.fireT = 0; this.spin = 0; this.flashT = 0; this.kick = 0; this.shots = 0; layoutBarrels(Up.barrels); },
  update(dt){
    this.fireT -= dt; this.idleT += dt;
    // 停火 0.2 秒后才开始散热；连续开火约 4 秒过热
    if(this.over || this.idleT > 0.2) this.heat = Math.max(0, this.heat - (this.over ? 0.45 : 0.55)*dt);
    if(this.over && this.heat <= 0.25){ this.over = false; }
    const want = Input.firing && !this.over && !Car.dead;
    this.spin = damp(this.spin, want ? 1 : 0, want ? 8 : 2.5, dt);
    for(let i=0;i<Up.barrels;i++) barrelSets[i].spin.rotation.z += this.spin*dt*34;
    const hg = clamp((this.heat - 0.3)/0.7, 0, 1)**2, pul = this.over ? 0.15 + Math.sin(Game.t*12)*0.1 : 0;
    HEAT_MAT.emissive.setRGB(hg*0.85 + pul, hg*0.22 + pul*0.2, hg*0.02);
    if(want && this.fireT <= 0){
      this.fireT = Math.max(this.fireT, -0.05) + 0.085/Up.rateMul;
      this.fire(); this.idleT = 0;
      this.heat += 0.021*Up.heatMul;
      if(this.heat >= 1){ this.heat = 1; this.over = true; Sfx.overheat(); HUD.toast(T('枪管过热！等待冷却', 'Overheated! Wait for it to cool')); }
    }
    this.flashT -= dt;
    const show = this.flashT > 0;
    for(let i=0;i<3;i++){ const b = barrelSets[i]; b.fl.visible = show && i < Up.barrels; b.fl2.visible = b.fl.visible; }
    gunFlashLight.intensity = show ? 2.2 : 0; muzzleLight.intensity = show ? 2.5 : 0;
    this.kick = damp(this.kick, 0, 18, dt);
    // 枪械晃动（转视角时滞后、移动时摆动）
    const sp = Math.hypot(Car.vel.x, Car.vel.z), t = Game.t;
    this.swayX = damp(this.swayX, clamp(-Input.lastLookDX*3, -0.08, 0.08), 8, dt);
    this.swayY = damp(this.swayY, clamp(Input.lastLookDY*3, -0.06, 0.06), 8, dt);
    gun.position.set(this.swayX + Math.sin(t*7)*0.012*sp/11, this.swayY + Math.abs(Math.cos(t*7))*0.014*sp/11 - this.kick*0.02, this.kick*0.09);
    gun.rotation.set(this.kick*0.03, this.swayX*0.5, 0);
  },
  _o:new V3(), _d:new V3(), _f:new V3(), _ndc:new V3(),
  fire(){
    this.shots++; this.flashT = 0.04; this.kick = 1;
    Cam.recoil += 0.006; Cam.trauma(0.035);
    Sfx.shot();
    const boom = Up.boomEvery && this.shots % Up.boomEvery === 0;
    const spread = 0.008 + this.heat*0.012 + (Up.barrels - 1)*0.006;
    camera.getWorldDirection(this._f);
    for(let i=0;i<Up.barrels;i++){
      const b = barrelSets[i];
      b.fl.scale.setScalar(rand(0.55, 0.9)); b.fl.rotation.z = Math.random()*6; b.fl2.scale.set(rand(0.4, 0.6), rand(0.25, 0.4), 1);
      const o = this._o.copy(camera.position), d = this._d.copy(this._f);
      d.x += rand(-spread, spread); d.y += rand(-spread, spread); d.z += rand(-spread, spread); d.normalize();
      this.hitscan(o, d, boom && i === 0, b);
    }
    muzzleLight.position.copy(camera.position).addScaledVector(this._f, 2);
  },
  hitscan(o, d, boom, barrel){
    const wh = World.ray(o, d, 160);
    const zs = Zombies.hits(o, d, wh.t);
    let n = 1 + Up.pierce, end = wh.t, anyKill = false, anyHead = false, any = false;
    for(const h of zs){
      if(n <= 0) break;
      const dmg = 20*Up.dmgMul*(h.head ? Up.headMul : 1), pt = o.clone().addScaledVector(d, h.t);
      const killed = Zombies.damage(h.z, dmg, d, 1.2, h.head, pt, false);
      FX.blood(pt, d, h.head ? 7 : 4);
      any = true; anyKill = anyKill || killed; anyHead = anyHead || h.head;
      n--; if(n === 0) end = h.t;
    }
    if(any){ HUD.hitmark(anyHead, anyKill); Sfx.hit(anyHead); }
    const hitP = o.clone().addScaledVector(d, end);
    if(end === wh.t && wh.hit){
      if(wh.kind === 'ground') FX.dust(hitP, 2, 0x7a6a4a, 0.18); else { FX.sparks(hitP, 3); FX.debris(hitP, wh.c, 2); }
    }
    if(boom) explode(hitP, { radius:3.2, zDmg:55, pDmg:0 });
    // 弹道起点：把枪口在枪械摄像机中的屏幕位置投回主摄像机
    gunScene.updateMatrixWorld(); const mz = barrel.fl.getWorldPosition(this._ndc).project(gunCam);
    const sd = this._ndc.set(mz.x, mz.y, 0.5).unproject(camera).sub(camera.position).normalize();
    Tracers.add(camera.position.clone().addScaledVector(sd, 2.6), hitP);
  },
};

const Cam = {
  tr:0, recoil:0, t:0,
  trauma(v){ this.tr = Math.min(1, this.tr + v); },
  update(dt){
    this.t += dt; this.tr = Math.max(0, this.tr - dt*1.6); this.recoil = damp(this.recoil, 0, 10, dt);
    const s = this.tr*this.tr, t = this.t*40;
    const sp = Math.hypot(Car.vel.x, Car.vel.z);
    const ox = Math.sin(Car.body)*-0.6*-1, oz = Math.cos(Car.body)*0.6;   // 炮塔在车身中后部
    camera.position.set(Car.pos.x + ox, 2.75 + Math.sin(Game.t*11)*0.025*Math.min(1, sp/6), Car.pos.z + oz);
    if(Car.dead) camera.position.y = 2.75 + Math.min(Car.deadT, 1.5)*1.6;
    camera.rotation.set(Car.pitch + this.recoil + s*0.05*Math.sin(t*1.3), Car.yaw + s*0.05*Math.sin(t*1.1 + 2), s*0.04*Math.sin(t*0.9 + 4));
  },
};

const Input = {
  keys:{}, firing:false, lookDX:0, lookDY:0, lastLookDX:0, lastLookDY:0, stick:{ x:0, y:0 }, locked:false, _mv:{ x:0, y:0 },
  moveVec(){
    const k = this.keys, m = this._mv;
    let x = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0), y = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0);
    x += this.stick.x; y += this.stick.y;
    const l = Math.hypot(x, y); if(l > 1){ x /= l; y /= l; }
    m.x = x; m.y = y; return m;
  },
  applyLook(){
    Car.yaw -= this.lookDX; Car.pitch = clamp(Car.pitch - this.lookDY, -1.0, 0.95);
    this.lastLookDX = this.lookDX; this.lastLookDY = this.lookDY; this.lookDX = this.lookDY = 0;
  },
};

// 触屏
const Touch = { stick:null, fire:null, look:new Map(), base:{ x:0, y:0 }, swipeT:0 };
const touchEl = $('touch'), stickEl = $('stick'), knobEl = $('knob'), fireEl = $('fireBtn');
const STICK_R = 58;
function stickCenter(){ const r = stickEl.getBoundingClientRect(); return { x:r.left + r.width/2, y:r.top + r.height/2 }; }
function setKnob(dx, dy){ knobEl.style.transform = `translate(${dx}px,${dy}px)`; }
touchEl.addEventListener('pointerdown', e => {
  e.preventDefault(); Sfx.init();
  const x = e.clientX, y = e.clientY, W = innerWidth, H = innerHeight;
  const fr = fireEl.getBoundingClientRect(), fx = fr.left + fr.width/2, fy = fr.top + fr.height/2;
  if(!Touch.fire && Math.hypot(x - fx, y - fy) < fr.width*0.7){ Touch.fire = { id:e.pointerId, x, y }; Input.firing = true; fireEl.classList.add('on'); return; }
  if(!Touch.stick && x < W*0.45 && y > H*0.35){
    let c = stickCenter();
    if(Math.hypot(x - c.x, y - c.y) > STICK_R*1.3){ stickEl.style.left = (x - 75) + 'px'; stickEl.style.top = (y - 75) + 'px'; stickEl.style.bottom = 'auto'; c = { x, y }; }
    Touch.stick = { id:e.pointerId, cx:c.x, cy:c.y }; moveStick(x, y); return;
  }
  Touch.look.set(e.pointerId, { x, y });
}, { passive:false });
function moveStick(x, y){
  const s = Touch.stick; let dx = x - s.cx, dy = y - s.cy; const l = Math.hypot(dx, dy);
  if(l > STICK_R){ dx *= STICK_R/l; dy *= STICK_R/l; }
  setKnob(dx, dy);
  const m = Math.min(1, l/STICK_R), dead = 0.12, k = m < dead ? 0 : (m - dead)/(1 - dead);
  Input.stick.x = l > 0 ? dx/Math.min(l, STICK_R)*k : 0; Input.stick.y = l > 0 ? -dy/Math.min(l, STICK_R)*k : 0;
}
touchEl.addEventListener('pointermove', e => {
  // 滑屏灵敏度按屏幕宽度归一化：横向划满一屏 ≈ 转 180°（不同手机手感一致）
  const x = e.clientX, y = e.clientY, k = 3.2/Math.max(320, innerWidth)*S.dragSens, ky = k*0.8;
  if(Touch.stick && Touch.stick.id === e.pointerId){ moveStick(x, y); return; }
  if(Touch.fire && Touch.fire.id === e.pointerId){ Input.lookDX += (x - Touch.fire.x)*k*0.8; Input.lookDY += (y - Touch.fire.y)*ky*0.8; Touch.fire.x = x; Touch.fire.y = y; Touch.swipeT = 0.15; return; }
  const L = Touch.look.get(e.pointerId);
  if(L){ Input.lookDX += (x - L.x)*k; Input.lookDY += (y - L.y)*ky; L.x = x; L.y = y; Touch.swipeT = 0.15; }
}, { passive:false });
function touchEnd(e){
  if(Touch.stick && Touch.stick.id === e.pointerId){ Touch.stick = null; Input.stick.x = Input.stick.y = 0; setKnob(0, 0); stickEl.style.left = ''; stickEl.style.top = ''; stickEl.style.bottom = ''; }
  if(Touch.fire && Touch.fire.id === e.pointerId){ Touch.fire = null; Input.firing = false; fireEl.classList.remove('on'); }
  Touch.look.delete(e.pointerId);
}
touchEl.addEventListener('pointerup', touchEnd); touchEl.addEventListener('pointercancel', touchEnd);
function releaseTouches(){ Touch.stick = null; Touch.fire = null; Touch.look.clear(); Input.stick.x = Input.stick.y = 0; Input.firing = false; setKnob(0, 0); fireEl.classList.remove('on'); stickEl.style.left = stickEl.style.top = stickEl.style.bottom = ''; }

// 陀螺仪：设备姿态 → 摄像机朝向（与 three.js DeviceOrientationControls 相同的换算），每帧取增量加到视角上
const Gyro = {
  has:false, a:0, b:0, g:0, lastYaw:null, lastPitch:null, pendY:0, pendP:0, seenT:0,
  q:new THREE.Quaternion(), e:new THREE.Euler(), q0:new THREE.Quaternion(), q1:new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)), z:new V3(0, 0, 1), f:new V3(),

  },
  reset(){ this.lastYaw = null; this.lastPitch = null; this.pendY = this.pendP = 0; },
  step(dt){
    if(!IS_TOUCH || !S.gyro || !this.has) return;
    const D = THREE.MathUtils.DEG2RAD, orient = ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0)*D;
    this.e.set(this.b*D, this.a*D, -this.g*D, 'YXZ');

    this.f.set(0, 0, -1).applyQuaternion(this.q);

addEventListener('deviceorientation', Gyro.onEvent);

// 瞄准辅助（只给触屏）：准星靠近僵尸时滑屏变慢一点（黏滞），滑屏/开火时轻轻往目标拉；手不动时不会自己转
const Assist = {
  target:null, lock:false, err:1, _d:new V3(),
  step(dt){
    Touch.swipeT -= dt;
    this.lock = false; this.target = null; this.err = 1;
    if(!IS_TOUCH || !S.assist || Car.dead) return;
    const o = camera.position;
    let best = null, bs = 1, bY = 0, bP = 0, bD = 0;
    for(const z of Zombies.list){
      if(z.dead || z.idle || z.rise < 1) continue;
      const dx = z.pos.x - o.x, dz = z.pos.z - o.z, dy = z.pos.y + 0.9*z.s - o.y, h = Math.hypot(dx, dz);
      if(h > 55 || h < 1.5) continue;
      const ey = wrapA(Math.atan2(-dx, -dz) - Car.yaw), ep = Math.atan2(dy, h) - Car.pitch;
      const r = clamp(Math.atan(1.4*z.s/h), 0.044, 0.122), e = Math.hypot(ey, ep)/r;   // 辅助半径 2.5°~7°
      if(e < bs){ bs = e; best = z; bY = ey; bP = ep; bD = Math.hypot(h, dy); }
    }
    if(!best) return;
    const ty = Car.yaw + bY, tp = Car.pitch + bP;
    const d = this._d.set(-Math.sin(ty)*Math.cos(tp), Math.sin(tp), -Math.cos(ty)*Math.cos(tp));
    if(World.ray(o, d, bD - best.r).hit) return;   // 被墙挡住就不辅助
    this.lock = true; this.target = best; this.err = bs;
    const fr = 0.6 + 0.4*bs;   // 越靠近中心越黏
    Input.lookDX *= fr; Input.lookDY *= fr;
    if(Touch.swipeT > 0 || Input.firing){
      const k = 2.5*(1 - bs)*dt, cap = 0.5*dt;
      Car.yaw += clamp(bY*k, -cap, cap);
      Car.pitch = clamp(Car.pitch + clamp(bP*k, -cap, cap), -1.0, 0.95);
    }
  },
};

const Waves = {
  n:0, q:[], spawnT:0, phase:'wait', t:0, hpMul:1, seen:{},
  reset(){ this.n = 0; this.q = []; this.phase = 'wait'; this.t = 2.5; this.seen = {}; },
  build(n){
    const total = Math.round(6 + n*3 + n*n*0.12);
    const w = { normal:1, runner:n >= 2 ? 0.2 + 0.035*n : 0, exploder:n >= 3 ? 0.1 + 0.012*n : 0, brute:n >= 4 ? 0.06 + 0.012*n : 0, spitter:n >= 5 ? 0.08 + 0.01*n : 0 };
    const sum = Object.values(w).reduce((a, b) => a + b, 0), q = [];
    for(let i=0;i<total;i++){ let r = Math.random()*sum; for(const k in w){ r -= w[k]; if(r <= 0){ q.push(k); break; } } }
    // 新敌人首次登场的那一波，保证前面就出现一只
    const intro = { 2:'runner', 3:'exploder', 4:'brute', 5:'spitter' }[n]; if(intro) q.splice(2, 0, intro);
    if(n % 5 === 0) q.splice(Math.floor(q.length*0.25), 0, 'boss');
    return q;
  },
  start(n){
    this.n = n; this.q = this.build(n); this.total = this.q.length; this.phase = 'combat'; this.spawnT = 0.5; this.hpMul = 1 + 0.11*(n - 1);
    HUD.announce(T('第 ' + n + ' 波', 'WAVE ' + n), n % 5 === 0 ? T('BOSS 来袭！', 'BOSS INCOMING!') : T('消灭所有僵尸', 'Kill all zombies'), n % 5 === 0 ? '#ff5a3a' : '#ffd28a');
    Sfx.horn();
    if(n > 1) Pickups.randomSpawn();
  },
  remaining(){ return this.q.length + Zombies.list.filter(z => !z.idle).length; },
  spawnOne(type){
    for(let i=0;i<24;i++){
      const a = Math.random()*Math.PI*2, r = rand(30, 54);
      const x = clamp(Car.pos.x + Math.cos(a)*r, -ARENA + 3, ARENA - 3), z = clamp(Car.pos.z + Math.sin(a)*r, -ARENA + 3, ARENA - 3);
      if(Math.hypot(x - Car.pos.x, z - Car.pos.z) < 24) continue;
      const p = { x, z }; if(World.pushOut(p, 1.2*ZT[type].scale)) continue;
      const hp = type === 'boss' ? 1 + 0.5*(this.n/5 - 1) : this.hpMul;
      const zz = Zombies.spawn(type, x, z, hp);
      if(zz && !this.seen[type]){ this.seen[type] = true; if(ZINFO[type]) HUD.toast(T('新敌人 · ' + ZNAME[type] + '：' + ZINFO[type], 'New enemy · ' + ZNAME_EN[type] + ': ' + ZINFO_EN[type]), 5); }
      if(zz && type === 'boss'){ Sfx.roar(); Cam.trauma(0.4); }
      return !!zz;
    }
    return false;
  },
  update(dt){
    if(this.phase === 'wait'){ this.t -= dt; if(this.t <= 0) this.start(this.n + 1); return; }
    if(this.phase === 'combat'){
      this.spawnT -= dt;
      const cap = Math.min(MAX_Z - 4, 22 + this.n*2);
      if(this.spawnT <= 0 && this.q.length && Zombies.list.length < cap){
        if(this.spawnOne(this.q[0])) this.q.shift();
        this.spawnT = Math.max(0.3, 1.25 - this.n*0.06)*rand(0.6, 1.4);
      }
      if(!this.q.length && !Zombies.list.length){ this.phase = 'clear'; this.t = 1.8; HUD.announce(T('第 ' + this.n + ' 波 完成', 'WAVE ' + this.n + ' CLEAR'), '+' + (this.n*100) + T(' 分', ' pts'), '#7dff6a'); Game.score += this.n*100; Sfx.pickup(); }
      return;
    }
    if(this.phase === 'clear'){ this.t -= dt; if(this.t <= 0 && !Car.dead) Game.showUpgrade(); }
  },
};

    cross.classList.toggle('hot', Gun.over); cross.classList.toggle('lock', Assist.lock && !Gun.over);

    this.toastT -= dt; if(this.toastT <= 0) $('toast').style.opacity = 0;
    $('vig').style.opacity = Math.max(Car.hurtT*0.8, hp < 0.3 ? 0.35 + Math.sin(Game.t*5)*0.15 : 0);
    for(const d of [...$('dmgDirs').children]){ d._t -= dt; d.style.opacity = Math.max(0, d._t); if(d._t <= 0) d.remove(); }
    $('clickHint').style.display = !IS_TOUCH && Game.state === 'play' && !Input.locked && !Car.dead ? 'block' : 'none';
    this.radar();

  // 雷达：圆角方形半透明卡片，敌人是彩色圆点
  radar(){

      const dx = x - Car.pos.x, dz = z - Car.pos.z, f = -dx*sy - dz*cy, r = dx*cy - dz*sy;

    for(const z of Zombies.list){

    g.restore();
  },
};

    this.setState('over'); Sfx.engine(0, false);
    this.unlockOk = true; if(document.pointerLockElement) document.exitPointerLock(); else this.unlockOk = false;
    const best = getBest(), nb = this.score > best; if(nb) setBest(this.score);
    $('stats').innerHTML = `<div class="stat main"><span>${T('得分', 'Score')}<em id="newBest">${T('新纪录！', 'NEW BEST!')}</em></span><b>${this.score}</b></div>` +
      `<div class="stat"><span>${T('坚持到', 'Reached')}</span><b>${T('第 ' + Waves.n + ' 波', 'Wave ' + Waves.n)}</b></div>` +
      `<div class="stat"><span>${T('击杀', 'Kills')}</span><b>${this.kills}</b></div>` +
      `<div class="stat"><span>${T('最高分', 'Best')}</span><b>${Math.max(best, this.score)}</b></div>`;
    $('newBest').style.display = nb && this.score > 0 ? 'inline-block' : 'none';
    this.showOv('over');
  },
  step(dt){
    this.t += dt;
    Gyro.step(dt); Assist.step(dt); Input.applyLook();
    Car.update(dt); Gun.update(dt);
    Zombies.update(dt); Acid.update(dt); Blasts.update(dt); Pickups.update(dt);
    if(!Car.dead) Waves.update(dt);
    if(Car.dead){ Car.deadT += dt/this.timeScale; if(Car.deadT > 2.2) this.gameOver(); }
    Sfx.engine(Math.hypot(Car.vel.x, Car.vel.z), !Car.dead);
  },
};
function refreshMenu(){
  $('ctrlHint').innerHTML = IS_TOUCH
    ? T('<b>滑动屏幕</b> 瞄准（带轻度瞄准辅助）<br><b>左下摇杆</b> 开车移动　<b>右下按钮</b> 按住开火<br>开车直接撞僵尸也能造成伤害；设置里可开陀螺仪',
        '<b>Swipe</b> to aim (light aim assist)<br><b>Left stick</b> to drive　<b>Bottom-right button</b> hold to fire<br>Ramming zombies also hurts them. Gyro aiming is in Settings')
    : T('<b>鼠标</b> 瞄准　<b>WASD</b> 开车移动　<b>左键</b> 按住开火<br><b>Esc</b> 暂停　开车直接撞僵尸也能造成伤害',
        '<b>Mouse</b> to aim　<b>WASD</b> to drive　<b>Left click</b> hold to fire<br><b>Esc</b> to pause　Ramming zombies also hurts them');
  const b = getBest(); $('bestTxt').innerHTML = b ? T('最高分 ', 'Best ') + '<b class="num">' + b + '</b>' : '';
}

// 主循环
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  advance(Math.min(0.05, (now - last)/1000)); last = now;
}
function advance(raw){
  const dt = raw*Game.timeScale;
  if(Game.state === 'play') Game.step(dt);
  else if(Game.state === 'menu'){
    Game.menuT += raw; Zombies.update(raw);
    const a = Game.menuT*0.12;
    camera.position.set(Car.pos.x + Math.sin(a)*10, 3.8, Car.pos.z + Math.cos(a)*10);
    camera.lookAt(Car.pos.x, 1.3, Car.pos.z);
  }
  if(Game.state !== 'menu') Cam.update(raw);
  PL.update(raw*Game.timeScale); PG.update(raw*Game.timeScale); Tracers.update(raw);
  boomLight.intensity = damp(boomLight.intensity, 0, 8, raw);
  Car.sync();
  sunL.position.copy(Car.pos).add(SUN_OFF); sunL.target.position.copy(Car.pos);
  if(document.body.classList.contains('playing')) HUD.update(raw);
  camera.updateMatrixWorld(); window.__skyG.quaternion.copy(camera.quaternion).invert();
  renderer.clear();
  renderer.render(scene, camera);
  if(Game.state !== 'menu' && !Car.dead){ renderer.clearDepth(); renderer.render(gunScene, gunCam); }
}
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, S.hq ? 2 : 1.25));
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.fov = w/h < 1.2 ? 80 : 66; camera.updateProjectionMatrix();
  gunCam.aspect = w/h; gunCam.updateProjectionMatrix();
  // 竖屏/窄屏时枪往上抬一点，保持在画面下方中间
  gun.scale.setScalar(w/h < 1.5 ? 0.85 : 1);
}
function applyQuality(){
  renderer.shadowMap.enabled = S.hq; sunL.castShadow = S.hq;
  scene.traverse(o => { if(o.material){ (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.needsUpdate = true); } });
  resize();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('visibilitychange', () => { if(document.hidden){ Game.pause(); if(Sfx.ctx) Sfx.ctx.suspend(); } else if(Sfx.ctx) Sfx.ctx.resume(); });

/* =====================================================================
   16. 菜单 / 设置 绑定
   ===================================================================== */
const btn = (id, fn) => (typeof id === 'string' ? $(id) : id).addEventListener('click', e => { e.stopPropagation(); Sfx.init(); Sfx.click(); fn(); });
let settingsBack = 'menu';
btn('bStart', () => Game.start());
btn('bSet', () => { settingsBack = 'menu'; openSettings(); });
btn('pResume', () => Game.resume());
btn('pSet', () => { settingsBack = 'pause'; openSettings(); });
btn('pRestart', () => Game.start());
btn('pQuit', () => Game.quit());
btn('oAgain', () => Game.start());
btn('oMenu', () => Game.quit());
btn('sBack', () => { saveS(); Game.showOv(settingsBack); });
btn('pauseBtn', () => Game.pause());
btn('calBtn', () => { Car.pitch = 0; Gyro.reset(); HUD.toast(T('视角已校准（水平）', 'View recalibrated (level)')); });
function openSettings(){
  const bind = (id, key, fmt=v => v) => {
    const el = $(id), out = el.parentElement.querySelector('output');
    const fill = () => { if(el.type === 'range') el.style.setProperty('--p', ((el.value - el.min)/(el.max - el.min)*100) + '%'); };
    if(el.type === 'checkbox') el.checked = !!S[key]; else { el.value = S[key]; if(out) out.textContent = fmt(+el.value); }
    fill();
    el.oninput = () => {
      if(el.type === 'checkbox') S[key] = el.checked; else { S[key] = +el.value; if(out) out.textContent = fmt(+el.value); }
      fill();
      if(key === 'vol') Sfx.setVol(S.vol);
      if(key === 'hq') applyQuality();
      if(key === 'gyro'){ applyGyroUI(); Gyro.reset(); if(S.gyro) Gyro.request(); }
      saveS();
    };
  };
  bind('sGyro', 'gyro'); bind('sGyroSens', 'gyroSens', v => v.toFixed(1)); bind('sDragSens', 'dragSens', v => v.toFixed(1)); bind('sAssist', 'assist');
  bind('sMouseSens', 'mouseSens', v => v.toFixed(1)); bind('sVol', 'vol', v => Math.round(v*100)); bind('sHq', 'hq');
  Game.showOv('settings');
}

function applyLang(){
  const en = S.lang === 'en';
  document.documentElement.lang = en ? 'en' : 'zh-CN';
  document.title = en ? 'Firepower Rig · 火力战车' : '火力战车 · Firepower Rig';
  for(const e of document.querySelectorAll('[data-en]')){ if(e.dataset.zh === undefined) e.dataset.zh = e.textContent; e.textContent = en ? e.dataset.en : e.dataset.zh; }
  $('pauseBtn').setAttribute('aria-label', T('暂停', 'Pause')); $('sBack').setAttribute('aria-label', T('返回', 'Back')); $('calBtn').setAttribute('aria-label', T('校准', 'Recalibrate'));
  $('logoMain').textContent = T('火力战车', 'FIREPOWER RIG'); $('logoSub').textContent = T('FIREPOWER RIG', '火力战车');
  $('bLang').textContent = en ? '中文' : 'English';
  for(const b of $('sLang').children) b.classList.toggle('on', b.dataset.l === S.lang);
  HUD.lastTxt = {}; refreshMenu();
}
const setLang = l => { S.lang = l; saveS(); applyLang(); };
btn('bLang', () => setLang(S.lang === 'en' ? 'zh' : 'en'));
for(const b of $('sLang').children) btn(b, () => setLang(b.dataset.l));
function applyGyroUI(){ document.body.classList.toggle('gyro-on', IS_TOUCH && !!S.gyro); }

// 启动
$('heart').innerHTML = ico('heart', 22);
for(const e of document.querySelectorAll('[data-ic]')) e.innerHTML = ico(e.dataset.ic, 22);
$('pauseBtn').innerHTML = ico('pause', 22); $('calBtn').innerHTML = ico('cal', 22);
FireRing.build(); applyGyroUI();
Car.reset(); Car.sync(); Game.menuScene(); applyLang(); applyQuality();
$('loading').remove();
requestAnimationFrame(frame);
window.FP = { renderer, scene, camera, carG, gunScene, gunCam, Game, Car, Gun, Zombies, Waves, Input, Up, Gyro, Assist, Touch, HUD, World, S, tick(sec, fn){ for(let i=0;i<sec*60;i++){ if(fn) fn(i/60); advance(1/60); } } };   // 调试用
</script>
</body>
