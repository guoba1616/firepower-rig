    if(Up.leech) Car.heal(Up.leech);
    if(Level.on) Level.onKill(z);
    const drop = z.type === 'boss' ? 1 : z.type === 'brute' ? (Level.on ? 0.12 : 0.25) : (Level.on ? 0.012 : 0.035);
    if(Math.random() < drop) Pickups.spawn(z.pos.x, z.pos.z);
    if(z.type === 'boss'){ HUD.announce(T('BOSS 已击败！', 'BOSS DEFEATED!'), '+' + z.cfg.score + T(' 分', ' pts'), '#ffd25a'); Cam.trauma(0.6); vibrate([60, 30, 60]); }
  },
  showUpgrade(){
    this.setState('upgrade'); Input.firing = false; releaseTouches(); Sfx.engine(0, false);
    this.unlockOk = true; if(document.pointerLockElement) document.exitPointerLock(); else this.unlockOk = false;
    $('upTitle').textContent = Level.on ? T('升级！', 'LEVEL UP!') + ' Lv ' + (Level.lv - Level.pend + 1) : Waves.phase === 'dawn' ? T('天亮了', 'Daybreak') : T('第 ' + Waves.n + ' 波完成', 'Wave ' + Waves.n + ' complete');
    const box = $('cards'); box.innerHTML = '';
    upgradeChoices().forEach((u, i) => {
      const c = document.createElement('div'); c.className = 'card' + (u.weapon ? ' wpn' : ''); c.style.animationDelay = (i*0.09) + 's';
      let lv, apply;
      if(u.weapon){
        const W = WEAPONS[u.id]; lv = Arms.lv(u.id);
        let st = ''; for(let k=0;k<5;k++) st += `<i class="${k < lv ? 'on' : k === lv ? 'new' : ''}"></i>`;
        const d = W.ds[lv];
        c.innerHTML = `<div class="card-in"><div class="wimg"><img src="${THUMB[u.id] || ''}" alt=""></div><div class="nm">${T(W.nm[0], W.nm[1])}</div><div class="ds">${T(d[0], d[1])}</div><div class="stars">${st}</div></div><b class="plate">${i + 1}</b><b class="wtag${lv ? '' : ' new'}">${lv ? 'Lv ' + (lv + 1) : T('新武器', 'NEW')}</b>`;
        apply = () => { Up.wl[u.id] = lv + 1; if(W.up) W.up(lv + 1); Arms.sync(); HUD.weapons(); };
      } else {
        lv = Up.lv[u.id] || 0;
        let pips = '';
        if(u.max < 99){ for(let k=0;k<u.max;k++) pips += `<i class="${k < lv ? 'on' : k === lv ? 'new' : ''}"></i>`; pips = `<div class="pips">${pips}</div>`; }
        else pips = '<div class="lv">' + T('可重复', 'Repeatable') + '</div>';
        c.innerHTML = `<div class="card-in"><div class="ic" style="--ic:${ICON[u.id] ? ICON[u.id][2] : '#555'}">${ICON[u.id] ? ico(u.id, 30) : u.ic}</div><div class="nm">${T(u.nm, UP_EN[u.id][0])}</div><div class="ds">${T(u.ds, UP_EN[u.id][1])}</div>${pips}</div><b class="plate">${i + 1}</b>`;
        apply = () => { Up.lv[u.id] = lv + 1; u.f(); };
      }
      c.onclick = () => { Sfx.click(); apply();
        if(Level.on){ Level.pend--; if(Level.pend > 0){ this.showUpgrade(); return; } this.showOv(null); this.setState('play'); Gyro.reset(); if(!IS_TOUCH) lockPointer(); return; }
        this.showOv(null); this.setState('play'); Waves.phase = 'wait'; Waves.t = Day.day ? 14 : 3; Gyro.reset(); if(!IS_TOUCH) lockPointer(); };
      box.appendChild(c);
    });
    this.showOv('upgrade');
  },
  gameOver(){
    this.setState('over'); Sfx.engine(0, false);
    this.unlockOk = true; if(document.pointerLockElement) document.exitPointerLock(); else this.unlockOk = false;
    const best = getBest(), nb = this.score > best; if(nb) setBest(this.score);
    const st2 = Level.on ? [T('坚持', 'Survived'), fmtT(Level.t)] : [T('存活', 'Survived'), T(Day.survived + ' 天', Day.survived + (Day.survived === 1 ? ' day' : ' days'))];
    const st4 = Level.on ? [T('等级', 'Level'), 'Lv ' + Level.lv] : [T('坚持到', 'Reached'), T('第 ' + Waves.n + ' 波', 'Wave ' + Waves.n)];
    this.result(T('战斗结束', 'GAME OVER'), T('战车被摧毁', 'Rig destroyed'), false, nb, [st2, [T('击杀', 'Kills'), this.kills], st4], null);
  },
  // 结算面板（失败 / 通关共用）
  result(status, title, win, nb, stats, nextId){
    $('resStatus').textContent = status; $('resStatus').classList.toggle('win', win); $('resTitle').textContent = title;
    $('stats').innerHTML = `<div class="stat main"><span>${T('得分', 'Score')}<em id="newBest">${T('新纪录！', 'NEW BEST!')}</em></span><b>${this.score}</b></div>` +
      stats.map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');
    $('newBest').style.display = nb && this.score > 0 ? 'inline-block' : 'none';
    this.nextId = nextId; $('oNext').style.display = nextId ? '' : 'none';
    $('oAgain').classList.toggle('primary', !nextId); $('oAgain').classList.toggle('secondary', !!nextId);
    this.showOv('over');
  },
  victory(){
    this.setState('over'); Sfx.engine(0, false); Sfx.pickup(); vibrate([40, 40, 40, 40, 120]);
    this.unlockOk = true; if(document.pointerLockElement) document.exitPointerLock(); else this.unlockOk = false;
    const L = Level.cfg, i = LEVELS.indexOf(L), next = LEVELS[i + 1];
    setCleared(L.id);
    const best = getBest(), nb = this.score > best; if(nb) setBest(this.score);
    this.result(T('通关', 'CLEARED'), T(L.name[0] + ' 通关！', L.name[1] + ' cleared!'), true, nb,
      [[T('用时', 'Time'), fmtT(Level.t)], [T('击杀', 'Kills'), this.kills], [T('等级', 'Level'), 'Lv ' + Level.lv]], next ? next.id : null);
  },
  step(dt){
    this.t += dt;
    Gyro.step(dt); Assist.step(dt); Input.applyLook();
    Car.update(dt); Gun.update(dt);
    Zombies.update(dt); Acid.update(dt); Blasts.update(dt); Pickups.update(dt); Arms.update(dt, !Car.dead);
    if(!Car.dead){ if(Level.on) Level.update(dt); else Waves.update(dt); }
    if(Level.on) Gems.update(dt);
    Dawn.update(dt);
    if(Car.dead){ Car.deadT += dt/this.timeScale; if(Car.deadT > 2.2) this.gameOver(); }
    Sfx.engine(Math.hypot(Car.vel.x, Car.vel.z), !Car.dead);
  },
};
const ART = {
  street:'<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice"><rect width="160" height="100" fill="#9fb8d8"/><rect y="62" width="160" height="38" fill="#4a4846"/>' +
    '<path d="M0 12h24v68H0zM26 30h20v50H26zM114 26h20v54h-20zM136 8h24v72h-24z" fill="#9a6a52"/><path d="M48 46h14v34H48zM98 42h14v38H98z" fill="#a8a49a"/>' +
    '<path d="M60 100L76 56h8l16 44z" fill="#565452"/><path d="M79 60h2v6h-2zM78.5 72h3v8h-3zM78 88h4v12h-4z" fill="#e8e4da"/>' +
    '<path d="M4 20h6v6H4zM14 20h6v6h-6zM4 34h6v6H4zM140 16h6v6h-6zM150 30h6v6h-6zM118 34h6v6h-6z" fill="#2c3640"/><path d="M14 34h6v6h-6zM150 16h6v6h-6z" fill="#ffe39a"/></svg>',
  bridge:'<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice"><rect width="160" height="100" fill="#9fb8d8"/><rect y="58" width="160" height="42" fill="#3a6a88"/>' +
    '<path d="M0 64h160v7H0z" fill="#948e84"/><path d="M36 10h6v64h-6zM118 10h6v64h-6z" fill="#a89a86"/><path d="M36 14h88v4H36z" fill="#a89a86"/>' +
    '<path d="M0 44Q20 64 39 14Q80 62 121 14Q140 64 160 44" stroke="#4a5058" stroke-width="1.6" fill="none"/>' +
    '<path d="M54 30v34M66 40v24M78 46v18M90 40v24M102 30v34" stroke="#4a5058" stroke-width=".8"/><path d="M0 80h160v2H0zM20 90h40v1.5H20zM100 88h44v1.5h-44z" fill="#6a9ab8"/></svg>',
  town:'<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice"><rect width="160" height="100" fill="#74944a"/><path d="M70 0h20v100H70zM0 42h160v18H0z" fill="#5c5a58"/>' +
    '<path d="M18 8h32v24H18zM108 68h34v22h-34z" fill="#a65a3e"/><path d="M108 10h30v22h-30z" fill="#a49a8c"/><path d="M22 70h10v10H22zM40 76h10v10H40zM144 14h10v10h-10z" fill="#4a8a34"/>' +
    '<path d="M79 4h2v8h-2zM79 22h2v8h-2zM79 70h2v8h-2zM79 88h2v8h-2zM10 50h8v2h-8zM28 50h8v2h-8zM124 50h8v2h-8zM142 50h8v2h-8z" fill="#d8b64a"/></svg>',
};
function renderLevels(){
  const box = $('levelList'), cl = getCleared(); box.innerHTML = '';
  const items = LEVELS.map((l, i) => ({ plate:String(i + 1).padStart(2, '0'), name:T(l.name[0], l.name[1]), ok:!!cl[l.id], art:ART[l.map],
      meta:cl[l.id] ? T('✓ 已通关', '✓ Cleared') : fmtT(l.dur) + ' · BOSS', go:() => Game.start({ mode:'level', id:l.id }) }))
    .concat([{ plate:'∞', name:T('无尽模式', 'Endless'), ok:false, art:ART.town, meta:T('最高分 ', 'Best ') + getBest(), go:() => Game.start({ mode:'endless' }) }]);
  items.forEach((it, i) => {
    const c = document.createElement('div'); c.className = 'map-card'; c.style.animationDelay = (i*0.05) + 's';
    c.innerHTML = `<div class="map-in"><div class="map-art">${it.art}</div><div class="map-info"><h3>${it.name}</h3><span class="${it.ok ? 'ok' : ''}">${it.meta}</span></div></div><b class="plate">${it.plate}</b>`;
    btn(c, it.go); box.appendChild(c);
  });
}
function refreshMenu(){
  const b = getBest(); $('bestTxt').innerHTML = b ? T('最高分 ', 'Best ') + '<b class="num">' + b + '</b>' : '';
}

// 主循环
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  advance(Math.min(0.05, (now - last)/1000)); last = now;
}
function advance(raw){
  const dt = raw*Game.timeScale;
  if(Game.state === 'play') Game.step(dt);
  else if(Game.state === 'menu'){
    Game.menuT += raw; Zombies.update(raw);
    const a = Game.menuT*0.12;
    camera.position.set(Car.pos.x + Math.sin(a)*10, 3.8, Car.pos.z + Math.cos(a)*10);
    camera.lookAt(Car.pos.x, 1.3, Car.pos.z);
  }
  if(Game.state !== 'menu') Cam.update(raw);
  PL.update(raw*Game.timeScale); PG.update(raw*Game.timeScale); Tracers.update(raw);
  boomLight.intensity = damp(boomLight.intensity, 0, 8, raw);
  Car.sync();
  sunL.position.copy(Car.pos).add(SUN_OFF); sunL.target.position.copy(Car.pos);
  Sky.update(raw);
  if(headL.intensity > 0){ const fx = -Math.sin(Car.yaw), fz = -Math.cos(Car.yaw); headL.position.set(Car.pos.x + fx*0.8, 2.6, Car.pos.z + fz*0.8); headL.target.position.set(Car.pos.x + fx*22, 0, Car.pos.z + fz*22); headL.target.updateMatrixWorld(); }
  if(document.body.classList.contains('playing')) HUD.update(raw);
  camera.updateMatrixWorld(); window.__skyG.quaternion.copy(camera.quaternion).invert();
  renderer.clear();
  renderer.render(scene, camera);
  if(Game.state !== 'menu' && !Car.dead){ renderer.clearDepth(); renderer.render(gunScene, gunCam); }
}
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, S.hq ? 2 : 1.25));
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.fov = w/h < 1.2 ? 80 : 66; camera.updateProjectionMatrix();
  gunCam.aspect = w/h; gunCam.updateProjectionMatrix();
  // 竖屏/窄屏时枪往上抬一点，保持在画面下方中间
  gun.scale.setScalar(w/h < 1.5 ? 0.85 : 1);
  buildCockpit(w/h); cockpit.visible = !!S.cockpit;
}
function applyQuality(){
  renderer.shadowMap.enabled = S.hq; sunL.castShadow = S.hq;
  scene.traverse(o => { if(o.material){ (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.needsUpdate = true); } });
  resize();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('visibilitychange', () => { if(document.hidden){ Game.pause(); if(Sfx.ctx) Sfx.ctx.suspend(); } else if(Sfx.ctx) Sfx.ctx.resume(); });

/* =====================================================================
   16. 菜单 / 设置 绑定
   ===================================================================== */
const btn = (id, fn) => (typeof id === 'string' ? $(id) : id).addEventListener('click', e => { e.stopPropagation(); Sfx.init(); Sfx.click(); fn(); });
let settingsBack = 'menu';
btn('bStart', () => { renderLevels(); Game.showOv('levels'); });
btn('lBack', () => Game.showOv('menu'));
btn('oNext', () => Game.start({ mode:'level', id:Game.nextId }));
btn('bSet', () => { settingsBack = 'menu'; openSettings(); });
btn('pResume', () => Game.resume());
btn('pSet', () => { settingsBack = 'pause'; openSettings(); });
btn('pRestart', () => Game.start());
btn('pQuit', () => Game.quit());
btn('oAgain', () => Game.start());
btn('oMenu', () => Game.quit());
btn('sBack', () => { saveS(); Game.showOv(settingsBack); });
btn('pauseBtn', () => Game.pause());
btn('calBtn', () => { Car.pitch = 0; Gyro.reset(); HUD.toast(T('已校准', 'Calibrated')); });
function openSettings(){
  const bind = (id, key, fmt=v => v) => {
    const el = $(id), out = el.parentElement.querySelector('output');
    const fill = () => { if(el.type === 'range') el.style.setProperty('--p', ((el.value - el.min)/(el.max - el.min)*100) + '%'); };
    if(el.type === 'checkbox') el.checked = !!S[key]; else { el.value = S[key]; if(out) out.textContent = fmt(+el.value); }
    fill();
    el.oninput = () => {
      if(el.type === 'checkbox') S[key] = el.checked; else { S[key] = +el.value; if(out) out.textContent = fmt(+el.value); }
      fill();
      if(key === 'vol') Sfx.setVol(S.vol);
      if(key === 'hq') applyQuality();
      if(key === 'gyro'){ applyGyroUI(); Gyro.reset(); if(S.gyro) Gyro.request(); }
      saveS();
    };
  };
  bind('sGyro', 'gyro'); bind('sGyroSens', 'gyroSens', v => v.toFixed(1)); bind('sDragSens', 'dragSens', v => v.toFixed(1)); bind('sAssist', 'assist');
  bind('sMouseSens', 'mouseSens', v => v.toFixed(1)); bind('sVol', 'vol', v => Math.round(v*100)); bind('sHq', 'hq'); bind('sFollow', 'follow'); bind('sVib', 'vib'); bind('sCockpit', 'cockpit');
  Game.showOv('settings');
}

function applyLang(){
  const en = S.lang === 'en';
  document.documentElement.lang = en ? 'en' : 'zh-CN';
  document.title = en ? 'Firepower Rig · 火力战车' : '火力战车 · Firepower Rig';
  for(const e of document.querySelectorAll('[data-en]')){ if(e.dataset.zh === undefined) e.dataset.zh = e.textContent; e.textContent = en ? e.dataset.en : e.dataset.zh; }
  $('pauseBtn').setAttribute('aria-label', T('暂停', 'Pause')); $('lBack').setAttribute('aria-label', T('返回', 'Back')); if($('levels').classList.contains('show')) renderLevels(); $('sBack').setAttribute('aria-label', T('返回', 'Back')); $('calBtn').setAttribute('aria-label', T('校准', 'Recalibrate'));
  $('logoMain').textContent = T('火力战车', 'FIREPOWER RIG'); $('logoSub').textContent = T('FIREPOWER RIG', '火力战车');
  $('bLang').textContent = en ? '中文' : 'English';
  for(const b of $('sLang').children) b.classList.toggle('on', b.dataset.l === S.lang);
  HUD.lastTxt = {}; refreshMenu();
}
const setLang = l => { S.lang = l; saveS(); applyLang(); };
btn('bLang', () => setLang(S.lang === 'en' ? 'zh' : 'en'));
for(const b of $('sLang').children) btn(b, () => setLang(b.dataset.l));
function applyGyroUI(){ document.body.classList.toggle('gyro-on', IS_TOUCH && !!S.gyro); }

// 启动
$('heart').innerHTML = ico('heart', 22);
for(const e of document.querySelectorAll('[data-ic]')) e.innerHTML = ico(e.dataset.ic, 22);
$('pauseBtn').innerHTML = ico('pause', 22); $('calBtn').innerHTML = ico('cal', 22);
FireRing.build(); applyGyroUI(); renderThumbs();
Car.reset(); Car.sync(); Game.menuScene(); applyLang(); applyQuality();
$('loading').remove(); Game.showOv('menu');
requestAnimationFrame(frame);
window.FP = { Arms, WEAPONS, THUMB, Day, Sky, Dawn, Level, Gems, LEVELS, renderer, scene, camera, carG, gunScene, gunCam, Game, Car, Gun, Zombies, Waves, Input, Up, Gyro, Assist, Touch, HUD, World, S, tick(sec, fn){ for(let i=0;i<sec*60;i++){ if(fn) fn(i/60); advance(1/60); } } };   // 调试用
</script>
